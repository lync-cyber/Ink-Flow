// ============================================================
// MARKDOWN PARSER — custom, no dependencies
// ============================================================
function parseMarkdown(md) {
  const lines = md.split("\n");
  const tokens = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    // blank
    if (line.trim() === "") { i++; continue; }
    // custom block :::type
    if (line.trim().startsWith(":::")) {
      const type = line.trim().slice(3).trim();
      const content = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith(":::")) { content.push(lines[i]); i++; }
      if (i < lines.length) i++; // skip closing :::
      tokens.push({ type: "custom", block: type, content: content.join("\n").trim() });
      continue;
    }
    // code block
    if (line.trimStart().startsWith("```")) {
      const lang = line.trim().slice(3).trim();
      const code = [];
      i++;
      while (i < lines.length && !lines[i].trimStart().startsWith("```")) { code.push(lines[i]); i++; }
      if (i < lines.length) i++;
      tokens.push({ type: "code", lang, content: code.join("\n") });
      continue;
    }
    // heading
    const hm = line.match(/^(#{1,6})\s+(.*)/);
    if (hm) { tokens.push({ type: "heading", level: hm[1].length, content: hm[2] }); i++; continue; }
    // hr
    if (/^[-*_]{3,}\s*$/.test(line.trim())) { tokens.push({ type: "hr" }); i++; continue; }
    // blockquote
    if (line.trimStart().startsWith(">")) {
      const bq = [];
      while (i < lines.length && lines[i].trimStart().startsWith(">")) { bq.push(lines[i].replace(/^>\s?/, "")); i++; }
      tokens.push({ type: "blockquote", content: bq.join("\n") });
      continue;
    }
    // table
    if (line.includes("|") && i + 1 < lines.length && /\|[\s-:]+\|/.test(lines[i + 1])) {
      const headers = line.split("|").map(s => s.trim()).filter(Boolean);
      i += 2; // skip header + separator
      const rows = [];
      while (i < lines.length && lines[i].includes("|")) {
        rows.push(lines[i].split("|").map(s => s.trim()).filter(Boolean));
        i++;
      }
      tokens.push({ type: "table", headers, rows });
      continue;
    }
    // unordered list
    if (/^\s*[-*+]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*+]\s+/, "")); i++; }
      tokens.push({ type: "ul", items });
      continue;
    }
    // ordered list
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++; }
      tokens.push({ type: "ol", items });
      continue;
    }
    // image — markdown syntax
    const imgm = line.match(/^!\[([^\]]*)\]\(([^)]+)\)/);
    if (imgm) { tokens.push({ type: "image", alt: imgm[1], src: imgm[2] }); i++; continue; }
    // image — <img> HTML tag
    const imgTag = line.match(/^<img\s+[^>]*src=["']([^"']+)["'][^>]*>/i);
    if (imgTag) {
      const altM = line.match(/alt=["']([^"']*?)["']/i);
      tokens.push({ type: "image", alt: altM ? altM[1] : "", src: imgTag[1] });
      i++; continue;
    }
    // inline SVG block — collect until </svg>
    if (line.trimStart().startsWith("<svg")) {
      const svgLines = [line];
      if (!line.includes("</svg>")) {
        i++;
        while (i < lines.length && !lines[i].includes("</svg>")) { svgLines.push(lines[i]); i++; }
        if (i < lines.length) { svgLines.push(lines[i]); i++; }
      } else { i++; }
      tokens.push({ type: "svg", content: svgLines.join("\n") });
      continue;
    }
    // paragraph (collect consecutive lines)
    const para = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== "" && !lines[i].match(/^#{1,6}\s/) && !lines[i].trimStart().startsWith(">") && !lines[i].trimStart().startsWith("```") && !lines[i].trimStart().startsWith(":::") && !/^[-*_]{3,}\s*$/.test(lines[i].trim()) && !/^\s*[-*+]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) && !lines[i].match(/^!\[/) && !lines[i].match(/^<img\s/i) && !lines[i].trimStart().startsWith("<svg")) {
      para.push(lines[i]);
      i++;
    }
    tokens.push({ type: "paragraph", content: para.join(" ") });
  }
  return tokens;
}

function inlineFormat(text, theme, isDark) {
  const c = isDark ? theme.dark : theme.colors;
  let s = text;
  // bold
  s = s.replace(/\*\*(.+?)\*\*/g, `<strong style="color:${c.primary};font-weight:600;">$1</strong>`);
  // italic
  s = s.replace(/\*(.+?)\*/g, `<em style="font-style:italic;">$1</em>`);
  // inline code
  s = s.replace(/`([^`]+)`/g, `<code style="font-family:Consolas,monospace;font-size:13px;background:${isDark ? '#333' : '#f0f0f0'};padding:1px 5px;border-radius:2px;color:${c.primary};">$1</code>`);
  // dashed underline ~~text~~
  s = s.replace(/~~(.+?)~~/g, `<span style="border-bottom:1px dashed ${c.accent};padding-bottom:1px;">$1</span>`);
  // links
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, `<a href="$2" style="color:${c.accent};text-decoration:none;border-bottom:1px solid ${c.accent};">$1</a>`);
  // sup references [1]
  s = s.replace(/\[(\d+)\]/g, `<sup style="color:${c.accent};font-size:10px;">[$1]</sup>`);
  return s;
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ============================================================
// SIMPLE SYNTAX HIGHLIGHTING for code blocks
// ============================================================
function highlightCode(escaped, lang) {
  const keywords = ["import", "from", "as", "def", "class", "return", "if", "else", "for", "in", "while", "try", "except", "with", "yield", "lambda", "not", "and", "or", "is", "None", "True", "False", "const", "let", "var", "function", "export", "default"];
  let result = escaped;
  // comments (# ...)
  result = result.replace(/(#[^\n]*)/g, '<span style="color:#7c8ba1;">$1</span>');
  // strings (double and single quoted)
  result = result.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;|"[^"]*?"|'[^']*?')/g, '<span style="color:#c3e88d;">$1</span>');
  // keywords
  const kwPattern = new RegExp(`\\b(${keywords.join("|")})\\b`, "g");
  result = result.replace(kwPattern, '<span style="color:#c792ea;">$1</span>');
  // function calls word(
  result = result.replace(/\b([a-zA-Z_]\w*)\(/g, '<span style="color:#82aaff;">$1</span>(');
  return result;
}

// ============================================================
// RENDER TOKENS → INLINE-STYLED HTML
// ============================================================
function renderTokens(tokens, theme, spec, isDark) {
  const c = isDark ? theme.dark : theme.colors;
  const lc = theme.colors; // always-light colors for reference
  const bgColor = isDark ? c.bg : "#fff";
  const parts = [];
  let isFirstH1 = true;

  const storyLH = theme.id === "story" ? 2.0 : spec.lineHeight;
  const pStyle = `font-size:${spec.fontSize}px;line-height:${storyLH};color:${c.text};letter-spacing:${spec.letterSpacing}px;text-align:justify;margin:0 0 ${Math.round(spec.fontSize * 1.1)}px;`;

  for (let ti = 0; ti < tokens.length; ti++) {
    const tok = tokens[ti];
    switch (tok.type) {
      case "heading": {
        if (tok.level === 1) {
          // ===== P0: HEADER AREA — per-theme column identity =====
          if (isFirstH1) {
            isFirstH1 = false;
            if (theme.id === "academic") {
              parts.push(`<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid ${c.border};"><div style="width:4px;height:28px;background:${c.primary};border-radius:2px;"></div><span style="font-size:12px;color:${c.primary};letter-spacing:4px;font-weight:500;">学术前沿</span><span style="font-size:10px;color:${c.textTer || c.textSec};margin-left:auto;font-family:monospace;">VOL.037</span></div>`);
              parts.push(`<h1 style="font-size:22px;font-weight:700;line-height:1.5;color:${c.text};margin:0 0 16px;padding:0;">${inlineFormat(tok.content, theme, isDark)}</h1>`);
              // Check if next token is a blockquote (used as abstract)
              if (ti + 1 < tokens.length && tokens[ti + 1].type === "blockquote") {
                ti++;
                parts.push(`<p style="font-size:13px;color:${c.textSec};line-height:1.8;margin:0 0 16px;padding-left:12px;border-left:2px solid ${c.accent};">${inlineFormat(tokens[ti].content, theme, isDark)}</p>`);
              }
            } else if (theme.id === "industry") {
              parts.push(`<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;"><div style="background:${c.primary};color:#fff;font-size:11px;padding:4px 12px;border-radius:2px;font-weight:600;letter-spacing:2px;">行业动态</div><div style="height:1px;flex:1;background:${c.border};"></div><span style="font-size:10px;color:${c.textTer || c.textSec};">2025.12 周报</span></div>`);
              parts.push(`<h1 style="font-size:20px;font-weight:700;line-height:1.5;color:${c.text};margin:0 0 12px;padding:0;">${inlineFormat(tok.content, theme, isDark)}</h1>`);
              // Inject tag pills
              parts.push(`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;"><span style="font-size:11px;padding:2px 10px;background:${isDark ? c.surface : lc.bg};color:${c.primary};border-radius:2px;">政策</span><span style="font-size:11px;padding:2px 10px;background:${isDark ? c.surface : lc.bg};color:${c.primary};border-radius:2px;">融资</span><span style="font-size:11px;padding:2px 10px;background:${isDark ? c.surface : lc.bg};color:${c.primary};border-radius:2px;">产品</span><span style="font-size:11px;padding:2px 10px;background:${isDark ? c.surface : lc.bg};color:${c.primary};border-radius:2px;">技术突破</span></div>`);
            } else if (theme.id === "tech") {
              parts.push(`<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;"><span style="font-family:Consolas,monospace;font-size:12px;color:${c.primary};font-weight:600;">// 技术专栏</span><span style="font-size:10px;color:${c.textTer || c.textSec};font-family:Consolas,monospace;">#部署 #量化</span></div>`);
              parts.push(`<h1 style="font-size:20px;font-weight:700;line-height:1.5;color:${c.text};margin:0 0 12px;padding:0;">${inlineFormat(tok.content, theme, isDark)}</h1>`);
              parts.push(`<div style="background:${isDark ? c.surface : lc.bg};border-left:3px solid ${c.primary};padding:10px 14px;font-size:12px;color:${c.textSec};line-height:1.7;margin-bottom:16px;"><strong style="color:${c.text};">12分钟</strong> · 难度 ⬤⬤⬤○○ · 前置：PyTorch基础</div>`);
            } else {
              // story
              parts.push(`<div style="font-size:11px;color:${c.accent};letter-spacing:6px;margin-bottom:20px;font-weight:500;">人物故事</div>`);
              parts.push(`<h1 style="font-size:24px;font-weight:400;line-height:1.7;color:${c.text};margin:0 0 20px;padding:0;">${inlineFormat(tok.content, theme, isDark)}</h1>`);
              // Check if next token is an italic paragraph (subtitle)
              if (ti + 1 < tokens.length && tokens[ti + 1].type === "paragraph" && tokens[ti + 1].content.startsWith("*") && tokens[ti + 1].content.endsWith("*")) {
                ti++;
                const subtitleText = tokens[ti].content.slice(1, -1);
                parts.push(`<p style="font-size:14px;color:${c.textSec};line-height:2;margin:0 0 16px;font-style:italic;">${inlineFormat(subtitleText, theme, isDark)}</p>`);
              }
            }
          } else {
            parts.push(`<h1 style="font-size:22px;font-weight:700;line-height:1.5;color:${c.text};margin:0 0 16px;padding:0;">${inlineFormat(tok.content, theme, isDark)}</h1>`);
          }
        } else if (tok.level === 2) {
          if (theme.id === "academic") {
            parts.push(`<h2 style="display:inline-block;font-size:18px;font-weight:700;color:${c.text};margin:28px 0 12px;padding-bottom:8px;border-bottom:2px solid ${c.primary};">${inlineFormat(tok.content, theme, isDark)}</h2>`);
          } else if (theme.id === "industry") {
            parts.push(`<h2 style="display:inline-block;font-size:17px;font-weight:700;color:#fff;margin:28px 0 12px;padding:8px 16px;border-radius:2px;background:${c.primary};">${inlineFormat(tok.content, theme, isDark)}</h2>`);
          } else if (theme.id === "tech") {
            parts.push(`<h2 style="font-size:17px;font-weight:700;color:${c.text};margin:28px 0 12px;font-family:Consolas,monospace;display:flex;align-items:center;gap:8px;"><span style="color:${c.primary};font-size:14px;">##</span>${inlineFormat(tok.content, theme, isDark)}</h2>`);
          } else {
            // story: centered + decorative divider below
            parts.push(`<h2 style="font-size:20px;font-weight:400;color:${c.text};margin:28px 0 0;text-align:center;">${inlineFormat(tok.content, theme, isDark)}</h2><div style="display:flex;justify-content:center;gap:4px;margin:8px 0 12px;"><span style="display:inline-block;width:20px;height:1.5px;background:${c.border};"></span><span style="display:inline-block;width:4px;height:4px;background:${c.accent};border-radius:50%;"></span><span style="display:inline-block;width:20px;height:1.5px;background:${c.border};"></span></div>`);
          }
        } else {
          if (theme.id === "tech") {
            parts.push(`<h3 style="font-size:14px;font-weight:600;color:${c.textSec};margin:20px 0 10px;font-family:Consolas,monospace;"><span style="color:${c.primary};margin-right:6px;">###</span>${inlineFormat(tok.content, theme, isDark)}</h3>`);
          } else if (theme.id === "academic") {
            parts.push(`<h3 style="font-size:15px;font-weight:600;color:${c.primary};margin:20px 0 10px;padding-left:12px;border-left:3px solid ${c.accent};">${inlineFormat(tok.content, theme, isDark)}</h3>`);
          } else if (theme.id === "industry") {
            parts.push(`<h3 style="font-size:15px;font-weight:600;color:${c.primary};margin:20px 0 10px;display:flex;align-items:center;gap:8px;"><span style="display:inline-block;width:6px;height:6px;background:${c.accent};border-radius:50%;"></span>${inlineFormat(tok.content, theme, isDark)}</h3>`);
          } else {
            // story: italic centered
            parts.push(`<h3 style="font-size:15px;font-weight:400;color:${c.primary};margin:20px 0 10px;font-style:italic;text-align:center;">${inlineFormat(tok.content, theme, isDark)}</h3>`);
          }
        }
        break;
      }
      case "paragraph":
        parts.push(`<p style="${pStyle}">${inlineFormat(tok.content, theme, isDark)}</p>`);
        break;
      case "blockquote": {
        const bqBg = isDark ? c.surface : lc.bg;
        const content = tok.content;
        // Story: detect quote + attribution pattern (line ending with ——)
        if (theme.id === "story") {
          const lines = content.split("\n");
          const attrLine = lines.find(l => l.includes("——"));
          if (attrLine) {
            const quoteText = lines.filter(l => !l.includes("——")).join(" ");
            parts.push(`<blockquote style="margin:0 0 16px;padding:20px 24px;text-align:center;"><div style="font-size:28px;color:${c.border};line-height:1;margin-bottom:8px;">"</div><p style="font-size:16px;color:${c.text};line-height:2;margin:0;font-style:italic;">${inlineFormat(quoteText, theme, isDark)}</p><div style="margin-top:12px;font-size:12px;color:${c.textSec};">${inlineFormat(attrLine, theme, isDark)}</div></blockquote>`);
          } else {
            parts.push(`<blockquote style="margin:0 0 16px;padding:20px 24px;text-align:center;"><p style="font-size:16px;color:${c.text};line-height:2;margin:0;font-style:italic;">${inlineFormat(content, theme, isDark)}</p></blockquote>`);
          }
        } else if (theme.id === "tech" && (content.includes("💡") || content.includes("提示"))) {
          // Tech: tip block with badge
          const tipText = content.replace(/^💡\s*提示[：:]\s*/, "").replace(/^💡\s*/, "");
          parts.push(`<blockquote style="margin:0 0 16px;padding:12px 16px;background:${bqBg};border-left:3px solid ${c.primary};border-radius:0 2px 2px 0;"><p style="font-size:13px;color:${c.textSec};line-height:1.7;margin:0;"><span style="font-family:Consolas,monospace;background:${isDark ? '#333' : '#fff'};padding:1px 6px;border-radius:2px;font-size:12px;color:${c.primary};">💡 提示</span>&nbsp; ${inlineFormat(tipText, theme, isDark)}</p></blockquote>`);
        } else {
          const bqBorder = theme.id === "industry" ? c.accent : c.primary;
          parts.push(`<blockquote style="margin:0 0 16px;padding:14px 18px;background:${bqBg};border-left:3px solid ${bqBorder};border-radius:0 2px 2px 0;"><p style="font-size:13px;color:${c.textSec};line-height:1.8;margin:0;text-align:justify;">${inlineFormat(content, theme, isDark)}</p></blockquote>`);
        }
        break;
      }
      case "ul": {
        const items = tok.items.map((item, idx) => {
          if (theme.id === "story") {
            // Hollow circle with border
            return `<div style="display:flex;gap:10px;margin-bottom:14px;align-items:flex-start;"><span style="width:8px;height:8px;border:1.5px solid ${c.accent};border-radius:50%;flex-shrink:0;margin-top:8px;"></span><span style="font-size:14px;line-height:1.8;color:${c.text};text-align:justify;">${inlineFormat(item, theme, isDark)}</span></div>`;
          } else if (theme.id === "industry") {
            const itemBg = idx % 2 === 0 ? `background:${isDark ? c.surface : lc.bg};border-radius:2px;padding:6px 12px;` : "";
            return `<div style="display:flex;gap:10px;margin-bottom:8px;${itemBg}align-items:flex-start;"><span style="color:${c.accent};flex-shrink:0;font-weight:700;">→</span><span style="font-size:14px;line-height:1.8;color:${c.text};text-align:justify;">${inlineFormat(item, theme, isDark)}</span></div>`;
          } else if (theme.id === "academic") {
            return `<div style="display:flex;gap:10px;margin-bottom:8px;align-items:flex-start;"><span style="color:${c.primary};flex-shrink:0;font-size:8px;margin-top:7px;">■</span><span style="font-size:14px;line-height:1.8;color:${c.text};text-align:justify;">${inlineFormat(item, theme, isDark)}</span></div>`;
          } else {
            // tech
            return `<div style="display:flex;gap:10px;margin-bottom:8px;align-items:flex-start;"><span style="color:${c.primary};flex-shrink:0;font-size:13px;">▸</span><span style="font-size:14px;line-height:1.8;color:${c.text};text-align:justify;">${inlineFormat(item, theme, isDark)}</span></div>`;
          }
        }).join("");
        parts.push(`<div style="margin:0 0 16px;">${items}</div>`);
        break;
      }
      case "ol": {

        } else if (blockType === "label") {
          // Section label — matches JSX fullpage mode labels
          const labelText = tok.content ? tok.content.trim() : "";
          const isNew = labelText.includes("[N]");
          const cleanLabel = labelText.replace("[N]", "").trim();
          parts.push(`<div style="font-size:9px;color:${isDark ? '#555' : '#bbb'};letter-spacing:2px;margin:20px 0 8px;display:flex;align-items:center;gap:4px;">${cleanLabel}${isNew ? '<span style="font-size:7px;padding:0 3px;background:#e74c3c;color:#fff;border-radius:2px;font-weight:600;line-height:14px;">N</span>' : ''}</div>`);
        } else if (blockType === "note") {
          // Note/tip — supports multi-line content with optional title
          const noteLines = (tok.content || "").split("\n").filter(l => l.trim());
          let noteHtml = `<div style="display:flex;align-items:center;gap:6px;margin-bottom:${noteLines.length > 1 ? '8px' : '0'};"><span style="font-family:Consolas,monospace;background:${isDark ? '#333' : '#fff'};padding:1px 6px;border-radius:2px;font-size:12px;color:${c.primary};">💡 提示</span>`;
          if (noteLines.length <= 1) {
            noteHtml += `<span style="font-size:13px;color:${c.textSec};line-height:1.7;">${noteLines[0] ? inlineFormat(noteLines[0], theme, isDark) : ""}</span></div>`;
          } else {
            // First line as title
            noteHtml += `<span style="font-size:13px;font-weight:600;color:${c.text};line-height:1.7;">${inlineFormat(noteLines[0], theme, isDark)}</span></div>`;
            // Remaining lines as individual paragraphs
            noteHtml += noteLines.slice(1).map(l =>
              `<p style="font-size:13px;color:${c.textSec};line-height:1.7;margin:4px 0 0;">${inlineFormat(l, theme, isDark)}</p>`
            ).join("");

          const refLines = (tok.content || "").split("\n").filter(l => l.trim());
          const refsHtml = refLines.map(l => {
            // Parse numbered references: "1. content" or "- content"
            const m = l.match(/^(\d+)[.、]\s*(.*)/);
            const num = m ? m[1] : "";
            const text = m ? m[2] : l.trim();
            // Format links within reference text
            const formatted = inlineFormat(text, theme, isDark);
            return `<div style="display:flex;gap:6px;margin-bottom:4px;font-size:12px;line-height:1.5;color:${c.textSec};">${num ? `<span style="color:${c.accent};font-weight:600;flex-shrink:0;">[${num}]</span>` : ""}<span style="word-break:break-all;">${formatted}</span></div>`;
          }).join("");
          parts.push(`<div style="margin:16px 0;padding:14px 16px;background:${isDark ? c.surface : lc.bgDeep || lc.bg};border-radius:2px;border-top:1px solid ${c.border};"><div style="font-size:11px;color:${c.textTer || c.textSec};letter-spacing:2px;margin-bottom:10px;font-weight:500;">参考文献</div>${refsHtml}</div>`);
        } else if (blockType === "timeline") {
          // Timeline — vertical timeline with date markers
          const tlLines = (tok.content || "").split("\n").filter(l => l.trim());
          const tlHtml = tlLines.map((l, idx) => {
            const m = l.match(/^(\S+)\s+(.*)/);
            const date = m ? m[1] : "";
            const desc = m ? m[2] : l.trim();
            const isLast = idx === tlLines.length - 1;
            return `<div style="display:flex;gap:12px;position:relative;"><div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:16px;"><div style="width:8px;height:8px;border-radius:50%;background:${idx === 0 ? c.accent : c.primary};margin-top:4px;flex-shrink:0;"></div>${!isLast ? `<div style="width:1px;flex:1;background:${c.border};margin:4px 0;"></div>` : ""}</div><div style="padding-bottom:${isLast ? '0' : '12px'};"><div style="font-size:12px;font-weight:600;color:${c.primary};font-family:Consolas,monospace;">${date}</div><div style="font-size:13px;color:${c.text};line-height:1.6;margin-top:2px;">${inlineFormat(desc, theme, isDark)}</div></div></div>`;
          }).join("");
          parts.push(`<div style="margin:0 0 16px;padding:16px;background:${cardBg};border-radius:2px;">${tlHtml}</div>`);
        } else if (blockType === "steps") {
          // Steps — numbered step indicators
          const stLines = (tok.content || "").split("\n").filter(l => l.trim());
          const stHtml = stLines.map((l, idx) => {
            const m = l.match(/^(?:Step\s*)?(\d+)[.:：]?\s*(.*)/i);
            const num = m ? m[1] : String(idx + 1);
            const text = m ? m[2] : l.trim();
            // Split on first : or ： for title:description
            const sep = text.includes("：") ? "：" : text.includes(":") ? ":" : null;
            const titlePart = sep ? text.slice(0, text.indexOf(sep)).trim() : text;
            const descPart = sep ? text.slice(text.indexOf(sep) + 1).trim() : "";
            return `<div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:${idx < stLines.length - 1 ? '12px' : '0'};"><div style="width:24px;height:24px;border-radius:50%;background:${c.primary};color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${num}</div><div style="flex:1;padding-top:2px;"><div style="font-size:14px;font-weight:600;color:${c.text};line-height:1.5;">${inlineFormat(titlePart, theme, isDark)}</div>${descPart ? `<div style="font-size:13px;color:${c.textSec};line-height:1.6;margin-top:2px;">${inlineFormat(descPart, theme, isDark)}</div>` : ""}</div></div>`;
          }).join("");
          parts.push(`<div style="margin:0 0 16px;padding:16px;background:${cardBg};border-radius:2px;">${stHtml}</div>`);
        } else {
          // Fallback: generic custom block
          const label = `📦 ${tok.block}`;
          const hint = "此组件需在公众号后台手动配置";
          parts.push(`<div style="margin:0 0 16px;padding:14px 18px;background:${cardBg};border:1px dashed ${c.border};border-radius:2px;"><div style="font-size:13px;font-weight:600;color:${c.primary};margin-bottom:6px;">${label}</div>${tok.content ? `<div style="font-size:13px;color:${c.text};line-height:1.6;margin-bottom:8px;">${inlineFormat(tok.content, theme, isDark)}</div>` : ""}<div style="font-size:11px;color:${c.textSec};font-style:italic;">${hint}</div></div>`);
        }
        break;
      }
      default: break;
    }
  }
  return parts.join("\n");
}

  const previewScrollRef = useRef(null);
  const syncingRef = useRef(false); // prevents infinite loop

  const theme = THEMES[themeId];

  // Scroll sync: proportional scroll position mapping
  const handleEditorScroll = useCallback(() => {
    if (syncingRef.current) return;
    const ed = editorRef.current;
    const pv = previewScrollRef.current;
    if (!ed || !pv) return;
    const edMax = ed.scrollHeight - ed.clientHeight;
    if (edMax <= 0) return;
    const ratio = ed.scrollTop / edMax;
    const pvMax = pv.scrollHeight - pv.clientHeight;
    syncingRef.current = true;
    pv.scrollTop = ratio * pvMax;
    requestAnimationFrame(() => { syncingRef.current = false; });
  }, []);

  const handlePreviewScroll = useCallback(() => {
    if (syncingRef.current) return;
    const ed = editorRef.current;
    const pv = previewScrollRef.current;
    if (!ed || !pv) return;
    const pvMax = pv.scrollHeight - pv.clientHeight;
    if (pvMax <= 0) return;
    const ratio = pv.scrollTop / pvMax;
    const edMax = ed.scrollHeight - ed.clientHeight;
    syncingRef.current = true;
    ed.scrollTop = ratio * edMax;
    requestAnimationFrame(() => { syncingRef.current = false; });
  }, []);

  // When theme changes, load its default content unless user has manually edited
  const handleThemeChange = useCallback((newId) => {
    setThemeId(newId);
    if (!userEdited) {
      setMd(DEFAULT_MDS[newId]);
    }
  }, [userEdited]);

  const handleMdChange = useCallback((e) => {
    setMd(e.target.value);
    setUserEdited(true);
  }, []);

  const handleResetContent = useCallback(() => {
    setMd(DEFAULT_MDS[themeId]);
    setUserEdited(false);
  }, [themeId]);

  const html = useMemo(() => {
    const tokens = parseMarkdown(md);
    return renderTokens(tokens, theme, spec, isDark);
  }, [md, themeId, isDark, spec]);

  // Render Mermaid diagrams after preview HTML is injected
  useEffect(() => {
    const el = previewRef.current;
    if (!el || typeof mermaid === "undefined") return;
    const pending = el.querySelectorAll(".mermaid-pending");
    if (pending.length === 0) return;
    pending.forEach(async (node, idx) => {
      try {
        const code = node.textContent;
        const id = `mermaid-render-${Date.now()}-${idx}`;
        const { svg } = await mermaid.render(id, code);
        node.innerHTML = svg;
        node.classList.remove("mermaid-pending");
      } catch (e) {
        node.innerHTML = `<pre style="font-size:11px;color:#e74c3c;white-space:pre-wrap;">Mermaid 渲染失败: ${e.message}\n\n${node.textContent}</pre>`;
        node.classList.remove("mermaid-pending");
      }
    });
  }, [html]);

  const wrappedHtml = useMemo(() => {
    const c = isDark ? theme.dark : theme.colors;
    const bgColor = isDark ? c.bg : "#fff";
    return `<div style="padding:${spec.pageMargin}px;background:${bgColor};max-width:100%;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;">${html}</div>`;
  }, [html, spec.pageMargin, isDark, theme]);

  const handleCopy = useCallback(async () => {
    try {
      const blob = new Blob([wrappedHtml], { type: "text/html" });
      const textBlob = new Blob([wrappedHtml], { type: "text/plain" });
      await navigator.clipboard.write([
        new ClipboardItem({ "text/html": blob, "text/plain": textBlob })
      ]);
      setCopyMsg("✓ 已复制富文本");
    } catch (e) {
      // fallback
      const ta = document.createElement("textarea");
      ta.value = wrappedHtml;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      setCopyMsg("✓ 已复制HTML源码");
    }
    setTimeout(() => setCopyMsg(""), 2000);
  }, [wrappedHtml]);

  const tc = isDark ? theme.dark : theme.colors;
  const uiBg = isDark ? "#111" : "#f4f4f5";
  const uiPanel = isDark ? "#1a1a1a" : "#fff";
  const uiBorder = isDark ? "#333" : "#e0e0e0";
  const uiText = isDark ? "#ccc" : "#333";
  const uiTextSec = isDark ? "#888" : "#888";

  return (
    <div style={{ height: "100vh", display: "flex", flexDirection: "column", background: uiBg, fontFamily: "-apple-system, 'PingFang SC', sans-serif", color: uiText, overflow: "hidden" }}>
      {/* ===== TOP BAR ===== */}
      <div style={{ background: isDark ? "#0a0a0a" : "#fff", borderBottom: `1px solid ${uiBorder}`, padding: "8px 12px", display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", flexShrink: 0 }}>
        {/* Theme pills */}
        <div style={{ display: "flex", gap: 4 }}>
          {Object.values(THEMES).map(t => (
            <button key={t.id} onClick={() => handleThemeChange(t.id)} style={{
              border: themeId === t.id ? `2px solid ${t.colors.primary}` : `1px solid ${uiBorder}`,
              background: themeId === t.id ? (isDark ? t.dark.surface : t.colors.bg) : "transparent",
              color: themeId === t.id ? t.colors.primary : uiTextSec,
              padding: "4px 10px", fontSize: 12, borderRadius: 2, cursor: "pointer", fontWeight: themeId === t.id ? 600 : 400,
            }}>
              {t.icon} {t.name}
            </button>
          ))}
        </div>
        <div style={{ flex: 1 }} />
        {/* Dark toggle */}
        <button onClick={() => setIsDark(!isDark)} style={{ border: `1px solid ${uiBorder}`, background: isDark ? "#333" : "#f5f5f5", color: uiText, padding: "4px 10px", fontSize: 11, borderRadius: 2, cursor: "pointer" }}>
          {isDark ? "☀" : "🌙"}
        </button>
        {/* Copy */}
        <button onClick={handleCopy} style={{ border: "none", background: theme.colors.primary, color: "#fff", padding: "5px 14px", fontSize: 12, borderRadius: 2, cursor: "pointer", fontWeight: 600, position: "relative" }}>
          {copyMsg || "复制富文本"}
        </button>
        {/* Source toggle */}
        <button onClick={() => setShowSource(!showSource)} style={{ border: `1px solid ${uiBorder}`, background: showSource ? theme.colors.primary : "transparent", color: showSource ? "#fff" : uiTextSec, padding: "4px 10px", fontSize: 11, borderRadius: 2, cursor: "pointer" }}>
          {"</>"}
        </button>
      </div>

      {/* ===== SPEC BAR ===== */}
      <div style={{ background: isDark ? "#151515" : "#fafafa", borderBottom: `1px solid ${uiBorder}`, padding: "6px 12px", display: "flex", gap: 16, alignItems: "center", flexShrink: 0, overflowX: "auto" }}>
        {[
          { label: "字号", key: "fontSize", min: 13, max: 18, unit: "px" },
          { label: "行高", key: "lineHeight", min: 1.5, max: 2.2, step: 0.05, unit: "x" },
          { label: "字距", key: "letterSpacing", min: 0, max: 2, step: 0.5, unit: "px" },
          { label: "边距", key: "pageMargin", min: 0, max: 24, unit: "px" },
        ].map(({ label, key, min, max, step, unit }) => (
          <div key={key} style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
            <span style={{ fontSize: 11, color: uiTextSec, whiteSpace: "nowrap" }}>{label}</span>
            <input
              type="range" min={min} max={max} step={step || 1}
              value={spec[key]}
              onChange={e => setSpec(s => ({ ...s, [key]: parseFloat(e.target.value) }))}
              style={{ width: 60, accentColor: theme.colors.primary }}
            />
            <span style={{ fontSize: 11, color: uiText, fontFamily: "monospace", minWidth: 32 }}>{spec[key]}{unit}</span>
          </div>
        ))}
        <button onClick={() => setSpec({ ...DEFAULT_SPEC })} style={{ border: `1px solid ${uiBorder}`, background: "transparent", color: uiTextSec, padding: "2px 8px", fontSize: 10, borderRadius: 2, cursor: "pointer", flexShrink: 0 }}>重置参数</button>
        {userEdited && <button onClick={handleResetContent} style={{ border: `1px solid ${uiBorder}`, background: "transparent", color: uiTextSec, padding: "2px 8px", fontSize: 10, borderRadius: 2, cursor: "pointer", flexShrink: 0 }}>重置内容</button>}
      </div>

      {/* ===== MOBILE TAB SWITCHER ===== */}
      <div className="mobile-tabs" style={{ display: "none", borderBottom: `1px solid ${uiBorder}`, background: uiPanel }}>
        {["edit", "preview"].map(t => (
          <button key={t} onClick={() => setTab(t)} style={{ flex: 1, border: "none", background: "none", padding: "10px", fontSize: 13, fontWeight: tab === t ? 600 : 400, color: tab === t ? theme.colors.primary : uiTextSec, borderBottom: tab === t ? `2px solid ${theme.colors.primary}` : "2px solid transparent", cursor: "pointer" }}>
            {t === "edit" ? "✏️ 编辑" : "👁 预览"}
          </button>
        ))}
      </div>

      {/* ===== MAIN CONTENT ===== */}
      <div style={{ flex: 1, display: "flex", overflow: "hidden", minHeight: 0 }}>
        {/* Editor */}
        <div style={{ flex: 1, display: "flex", flexDirection: "column", borderRight: `1px solid ${uiBorder}`, minWidth: 0 }}>
          <div style={{ padding: "6px 12px", fontSize: 11, color: uiTextSec, background: isDark ? "#151515" : "#fafafa", borderBottom: `1px solid ${uiBorder}`, flexShrink: 0, display: "flex", justifyContent: "space-between" }}>
            <span>Markdown</span>
            <span>{md.length} 字符</span>
          </div>
          <textarea
            ref={editorRef}
            value={md}
            onChange={handleMdChange}
            onScroll={handleEditorScroll}
            spellCheck={false}
            style={{
              flex: 1, display: "block", width: "100%",
              border: "none", outline: "none", resize: "none",
              padding: "12px 14px", fontSize: 13, lineHeight: 1.7,
              fontFamily: "'SF Mono', Consolas, 'Liberation Mono', monospace",
              background: isDark ? "#1a1a1a" : "#fff",
              color: isDark ? "#d4d4d4" : "#1e1e1e",
              boxSizing: "border-box", overflowY: "auto",
            }}
          />
        </div>

        {/* Preview */}
        <div style={{ flex: 1, display: "flex", flexDirection: "column", background: uiBg, minWidth: 0 }}>
          <div style={{ padding: "6px 12px", fontSize: 11, color: uiTextSec, background: isDark ? "#151515" : "#fafafa", borderBottom: `1px solid ${uiBorder}`, flexShrink: 0, display: "flex", justifyContent: "space-between" }}>
            <span>{isDark ? "🌙 深色预览" : "预览"} · {theme.name}</span>
            <span>375px</span>
          </div>
          <div
            ref={previewScrollRef}
            onScroll={handlePreviewScroll}
            style={{ flex: 1, overflowY: "auto", minHeight: 0, padding: "12px 8px" }}
          >
            {showSource ? (
              <pre style={{
                width: "100%", maxWidth: 500, margin: "0 auto",
                background: isDark ? "#1a1a1a" : "#fff",
                border: `1px solid ${uiBorder}`, borderRadius: 4,
                padding: 14, fontSize: 11, lineHeight: 1.6,
                color: isDark ? "#d4d4d4" : "#333",
                fontFamily: "Consolas, monospace", whiteSpace: "pre-wrap", wordBreak: "break-all",
              }}>
                {wrappedHtml}
              </pre>
            ) : (
              <div style={{
                width: 375, maxWidth: "100%", margin: "0 auto",
                background: isDark ? theme.dark.bg : "#fff",
                borderRadius: 12,
                boxShadow: isDark ? "0 0 0 1px #333" : "0 4px 24px rgba(0,0,0,0.08)",
              }}>
                {/* Phone status bar */}
                <div style={{ height: 28, background: isDark ? "#000" : "#f8f8f8", display: "flex", alignItems: "center", justifyContent: "center", borderRadius: "12px 12px 0 0", position: "sticky", top: 0, zIndex: 1 }}>
                  <span style={{ fontSize: 9, color: isDark ? "#666" : "#999" }}>微信公众号文章预览</span>
                </div>
                <div
                  ref={previewRef}
                  dangerouslySetInnerHTML={{ __html: wrappedHtml }}
                />
                {/* Bottom padding for scroll comfort */}
                <div style={{ height: 40 }} />
              </div>
            )}
          </div>
        </div>
      </div>

      {/* ===== SYNTAX HELP ===== */}
      <div style={{ background: isDark ? "#0a0a0a" : "#fff", borderTop: `1px solid ${uiBorder}`, padding: "5px 12px", fontSize: 10, color: uiTextSec, display: "flex", gap: 12, overflowX: "auto", flexShrink: 0, whiteSpace: "nowrap" }}>
        <span><b style={{ color: uiText }}>基础元素</b></span>
        <span># 文章头部区</span>
        <span>正文段落</span>
        <span>## / ### 标题</span>
        <span>&gt; 引用块</span>
        <span>- / 1. 列表</span>
        <span>--- 分割线</span>
        <span>![] 图片与图注</span>
        <span>``` 代码块</span>
        <span>| 表格</span>
        <span style={{ color: uiBorder }}>│</span>
        <span><b style={{ color: uiText }}>扩展组件</b></span>
        <span>:::card 信息卡片</span>
        <span>:::cta 行动引导</span>
        <span>:::footer 文末区</span>
        <span>:::media 音视频</span>
        <span>:::miniapp 小程序</span>
        <span>:::hashtag 话题标签</span>
        <span>:::collection 合集导航</span>
        <span>:::vote 投票互动</span>
        <span>:::readmore 阅读原文</span>
        <span>:::note 提示</span>
        <span style={{ marginLeft: "auto", color: theme.colors.primary }}>所有样式均为内联，可直接粘贴至公众号后台</span>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(WeChatTypesetter));
</script>
</body>
</html>
