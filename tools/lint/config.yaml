# InkFlow Markdown Lint 配置
# 只保留规则开关和严重级别；所有数据（禁用词、CSS 属性、阈值）来自 .claude/rules/data/*.yaml
# lint.py 在加载时合并 data 文件，构造完整配置

rules:
  block_syntax:
    enabled: true
    severity: error
    # 合法 :::block 类型（与 typesetter components.jsx 同步）
    valid_types:
      - card
      - cta
      - footer
      - media
      - miniapp
      - vote
      - collection
      - hashtag
      - readmore
      - label
      - note
      - references
      - timeline
      - steps

  typography:
    enabled: true
    severity: warning
    # 阈值来源：.claude/rules/data/typography-limits.yaml

  theme_constraints:
    enabled: true
    severity: error

  block_content:
    enabled: true
    severity: warning

  image_references:
    enabled: true
    severity: warning

  css_safety:
    enabled: true
    severity: error
    # 属性/值/标签黑名单来源：.claude/rules/data/css-safety.yaml

  article_structure:
    enabled: true
    severity: warning

  typesetter_compat:
    enabled: true
    severity: warning

  svg_readability:
    enabled: true
    severity: error
    # 字号阈值来源：.claude/rules/data/typography-limits.yaml 的 svg 段

  fixed_footer_area:
    enabled: true
    severity: error
    # article.md 必须包含 :::readmore 和 :::footer

  forbidden_patterns:
    enabled: true
    severity: warning
    # 词表来源：.claude/rules/data/forbidden-phrases.yaml

# 栏目特有覆盖（业务语义，不属于可复用 data）
column_overrides:
  学术前沿:
    theme_constraints:
      require_references: true
      require_tldr: true
  人物故事:
    theme_constraints:
      forbid_tldr: true
  技术专题:
    theme_constraints:
      require_code_block: true
