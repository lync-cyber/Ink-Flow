# InkFlow Markdown Lint 配置
# 每个规则类别可独立开关和设置严重级别

rules:
  block_syntax:
    enabled: true
    severity: error
    # 合法 :::block 类型（与 typesetter components.jsx 同步）
    valid_types:
      - card
      - cta
      - footer
      - media
      - miniapp
      - vote
      - collection
      - hashtag
      - readmore
      - label
      - note

  typography:
    enabled: true
    severity: warning
    max_paragraph_chars: 120      # ≈3 行 × 40 字/行 @15px/640px
    max_sentence_chars: 40        # writing-quality.md 规则
    allowed_headings: [2, 3, 4]   # H2-H4（H1 仅用于文章标题）

  theme_constraints:
    enabled: true
    severity: error

  block_content:
    enabled: true
    severity: warning

  image_references:
    enabled: true
    severity: warning

  css_safety:
    enabled: true
    severity: error
    forbidden_css:
      - "position:"
      - "@media"
      - "@keyframes"
      - ":hover"
      - ":active"
      - "float:"
    forbidden_tags:
      - "<style"
      - "<script"

  forbidden_patterns:
    enabled: true
    severity: warning

# 栏目特有覆盖
column_overrides:
  学术前沿:
    theme_constraints:
      require_references: true
      require_tldr: true
  人物故事:
    theme_constraints:
      forbid_tldr: true
  技术专题:
    theme_constraints:
      require_code_block: true
