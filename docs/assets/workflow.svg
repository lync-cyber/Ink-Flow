<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="InkFlow 从初始化到发布的完整工作流">
  <defs>
    <style>
      .bg        { fill: #FFFFFF; }
      .title     { font: 600 15px ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1F2328; }
      .subtitle  { font: 12px ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", sans-serif; fill: #656D76; }
      .step-tag  { font: 600 10px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #656D76; letter-spacing: 0.1em; }
      .step-name { font: 600 12px ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", sans-serif; fill: #1F2328; }
      .step-desc { font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #1F2328; }
      .stage     { font: 600 11px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #1F2328; }
      .stage-sub { font: 10px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #656D76; }
      .cp        { font: 600 10px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #BF4C00; letter-spacing: 0.08em; }
      .section-h { font: 600 12px ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", sans-serif; fill: #1F2328; letter-spacing: 0.04em; }
      .box       { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1; }
      .box-init  { fill: #F6F8FA; stroke: #D0D7DE; stroke-width: 1; }
      .box-stage { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1; }
      .box-cp    { fill: #FFF8F0; stroke: #FDAA67; stroke-width: 1; }
      .arrow     { stroke: #8C959F; stroke-width: 1.2; fill: none; }
      .arrow-acc { stroke: #0969DA; stroke-width: 1.4; fill: none; }
      .arrowhead { fill: #8C959F; }
      .arrowhead-acc { fill: #0969DA; }
      .bracket   { stroke: #8C959F; stroke-width: 1; fill: none; }
    </style>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="arrowhead"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="arrowhead-acc"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="520"/>

  <text x="24" y="32" class="title">从初始化到发布 · 端到端工作流</text>
  <text x="24" y="50" class="subtitle">bootstrap 拉框架 → workspace-init 建结构 → 绑 Profile → 告诉主题 → pipeline 自动推进 → 导出平台产物</text>

  <!-- ───── 初始化阶段（两行 4 步） ───── -->
  <text x="24" y="88" class="section-h">初始化</text>

  <!-- Step 1 -->
  <rect x="24" y="102" width="212" height="78" rx="6" class="box-init"/>
  <text x="40" y="122" class="step-tag">STEP 1 · FRAMEWORK</text>
  <text x="40" y="140" class="step-name">bootstrap.sh</text>
  <text x="40" y="160" class="step-desc">从 GitHub 拉 agents /</text>
  <text x="40" y="174" class="step-desc">skills / tools / profiles</text>

  <!-- Step 2 -->
  <rect x="260" y="102" width="212" height="78" rx="6" class="box-init"/>
  <text x="276" y="122" class="step-tag">STEP 2 · WORKSPACE</text>
  <text x="276" y="140" class="step-name">workspace-init skill</text>
  <text x="276" y="160" class="step-desc">建 content/ · profiles/</text>
  <text x="276" y="174" class="step-desc">runtime/ · 生成 .gitignore</text>

  <!-- Step 3 -->
  <rect x="496" y="102" width="212" height="78" rx="6" class="box-init"/>
  <text x="512" y="122" class="step-tag">STEP 3 · PROFILE</text>
  <text x="512" y="140" class="step-name">/profile use &lt;id&gt;</text>
  <text x="512" y="160" class="step-desc">写 lock + resolver 合成</text>
  <text x="512" y="174" class="step-desc">runtime/profile-resolved/</text>

  <!-- Step 4 -->
  <rect x="732" y="102" width="204" height="78" rx="6" class="box-init"/>
  <text x="748" y="122" class="step-tag">STEP 4 · TOPIC</text>
  <text x="748" y="140" class="step-name">告诉 Claude 主题</text>
  <text x="748" y="160" class="step-desc">orchestrator 创 brief</text>
  <text x="748" y="174" class="step-desc">→ 进入 pipeline</text>

  <!-- 横向连接线 -->
  <path class="arrow" d="M 236 141 L 260 141" marker-end="url(#a1)"/>
  <path class="arrow" d="M 472 141 L 496 141" marker-end="url(#a1)"/>
  <path class="arrow" d="M 708 141 L 732 141" marker-end="url(#a1)"/>

  <!-- 竖向连接到 pipeline -->
  <path class="arrow-acc" d="M 480 180 L 480 222" marker-end="url(#a2)"/>

  <!-- ───── Pipeline 阶段 ───── -->
  <text x="24" y="242" class="section-h">Pipeline · 8 阶段 · 3 检查点</text>

  <!-- brief -->
  <rect x="24" y="260" width="100" height="56" rx="6" class="box-stage"/>
  <text x="74" y="284" class="stage" text-anchor="middle">brief</text>
  <text x="74" y="302" class="stage-sub" text-anchor="middle">orchestrator</text>

  <!-- research -->
  <rect x="140" y="260" width="100" height="56" rx="6" class="box-stage"/>
  <text x="190" y="284" class="stage" text-anchor="middle">research</text>
  <text x="190" y="302" class="stage-sub" text-anchor="middle">researcher</text>

  <!-- atoms -->
  <rect x="256" y="260" width="100" height="56" rx="6" class="box-stage"/>
  <text x="306" y="284" class="stage" text-anchor="middle">atoms</text>
  <text x="306" y="302" class="stage-sub" text-anchor="middle">atomizer</text>

  <!-- outline -->
  <rect x="372" y="260" width="100" height="56" rx="6" class="box-stage"/>
  <text x="422" y="284" class="stage" text-anchor="middle">outline</text>
  <text x="422" y="302" class="stage-sub" text-anchor="middle">outliner</text>

  <!-- CP1 -->
  <rect x="488" y="268" width="56" height="40" rx="4" class="box-cp"/>
  <text x="516" y="292" class="cp" text-anchor="middle">CP1</text>

  <!-- draft ∥ figures (two stacked) -->
  <rect x="560" y="238" width="110" height="44" rx="6" class="box-stage"/>
  <text x="615" y="256" class="stage" text-anchor="middle">draft</text>
  <text x="615" y="270" class="stage-sub" text-anchor="middle">writer</text>

  <rect x="560" y="294" width="110" height="44" rx="6" class="box-stage"/>
  <text x="615" y="312" class="stage" text-anchor="middle">figures</text>
  <text x="615" y="326" class="stage-sub" text-anchor="middle">illustrator</text>

  <!-- join brace -->
  <path class="bracket" d="M 678 260 Q 686 260 686 288 Q 686 316 678 316"/>

  <!-- audit -->
  <rect x="698" y="260" width="100" height="56" rx="6" class="box-stage"/>
  <text x="748" y="284" class="stage" text-anchor="middle">audit</text>
  <text x="748" y="302" class="stage-sub" text-anchor="middle">auditor</text>

  <!-- CP2 -->
  <rect x="814" y="268" width="56" height="40" rx="4" class="box-cp"/>
  <text x="842" y="292" class="cp" text-anchor="middle">CP2</text>

  <!-- 连接线 -->
  <path class="arrow" d="M 124 288 L 140 288" marker-end="url(#a1)"/>
  <path class="arrow" d="M 240 288 L 256 288" marker-end="url(#a1)"/>
  <path class="arrow" d="M 356 288 L 372 288" marker-end="url(#a1)"/>
  <path class="arrow" d="M 472 288 L 488 288" marker-end="url(#a1)"/>
  <path class="arrow" d="M 544 288 L 560 260" marker-end="url(#a1)"/>
  <path class="arrow" d="M 544 288 L 560 316" marker-end="url(#a1)"/>
  <path class="arrow" d="M 690 288 L 698 288" marker-end="url(#a1)"/>
  <path class="arrow" d="M 798 288 L 814 288" marker-end="url(#a1)"/>

  <!-- 第二行 pipeline： polish → publish → CP3 → export -->
  <rect x="140" y="370" width="100" height="56" rx="6" class="box-stage"/>
  <text x="190" y="394" class="stage" text-anchor="middle">polish</text>
  <text x="190" y="412" class="stage-sub" text-anchor="middle">polisher</text>

  <rect x="256" y="370" width="100" height="56" rx="6" class="box-stage"/>
  <text x="306" y="394" class="stage" text-anchor="middle">publish</text>
  <text x="306" y="412" class="stage-sub" text-anchor="middle">publisher</text>

  <rect x="372" y="378" width="56" height="40" rx="4" class="box-cp"/>
  <text x="400" y="402" class="cp" text-anchor="middle">CP3</text>

  <!-- 导出产物 -->
  <rect x="464" y="356" width="472" height="84" rx="6" class="box"/>
  <text x="480" y="376" class="step-tag">EXPORT</text>
  <text x="480" y="396" class="step-desc">content/articles/{slug}/export/07-final/{platform}.md</text>
  <text x="480" y="412" class="step-desc">content/articles/{slug}/export/08-wechat-publish.md  ← 粘 wechat-typeset</text>
  <text x="480" y="428" class="step-desc">content/articles/{slug}/export/08-{zhihu|juejin|xiaohongshu}-publish.md</text>

  <!-- 从 CP2 绕回到 polish -->
  <path class="arrow" d="M 842 308 L 842 344 L 190 344 L 190 370" marker-end="url(#a1)"/>
  <path class="arrow" d="M 240 398 L 256 398" marker-end="url(#a1)"/>
  <path class="arrow" d="M 356 398 L 372 398" marker-end="url(#a1)"/>
  <path class="arrow" d="M 428 398 L 464 398" marker-end="url(#a1)"/>

  <!-- 脚注 -->
  <text x="24" y="480" class="subtitle">CP1 / CP2 / CP3 三个检查点由 orchestrator 通过 AskUserQuestion 向用户求确认；</text>
  <text x="24" y="498" class="subtitle">atoms 之前为平台无关产物；outline 起按 brief.target_platforms 扇出，每平台独立产出直至 publish。</text>
</svg>
