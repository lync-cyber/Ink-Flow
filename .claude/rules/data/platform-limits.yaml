# ============================================================
# 微信平台排版 & CSS 安全阈值（单一事实来源）
# 消费者：.claude/skills/quality-linting/scripts/lint.py、writer/illustrator/polisher agent、typeset-authoring skill
# 合并自：typography-limits.yaml + css-safety.yaml（2026-04-17）
# ============================================================

version: "2.0"

# ------------------------------------------------------------
# 段落与句子
# ------------------------------------------------------------
paragraph:
  max_chars: 120          # ≈3 行 × 40 字/行 @15px/640px
  no_first_line_indent: true

sentence:
  max_chars: 40
  split_at: ["但是", "因此", "所以", "，"]

# ------------------------------------------------------------
# 标题层级
# ------------------------------------------------------------
headings:
  allowed: [2, 3, 4]      # H2-H4；H1 仅用于文章标题

# ------------------------------------------------------------
# 图片
# ------------------------------------------------------------
image:
  max_width: 640

# ------------------------------------------------------------
# SVG 可读性（640→375 缩放系数 ≈0.586）
# ------------------------------------------------------------
svg:
  min_font_size: 14        # 正文/数据标签（硬下限，lint 报 error）
  caption_font_size: 12    # 图注/脚注（warning 可人工放行）
  title_font_size: 18      # 主标题
  section_font_size: 16    # 节标题
  min_font_weight: 400
  max_font_variants: 4
  font_stack: '"Microsoft YaHei","PingFang SC",sans-serif'

# SVG 微信特有约束（保留作为规范声明；illustrator 现以 SVG→PNG 转换规避，此段已无运行时消费者）
svg_wechat:
  forbid_id_attribute: true
  forbid_style_tag: true
  forbid_script_tag: true
  forbid_anchor_tag: true
  background_url_no_quotes: true

# ------------------------------------------------------------
# CSS 安全（lint.py rule_css_safety 消费）
# 仅保留 lint 真正检查的字段；完整白名单讨论见 core/platform-base.md
# ------------------------------------------------------------
forbidden_css:
  - "position:"       # 粘贴后被剥离
  - "@media"
  - "@keyframes"
  - ":hover"
  - ":active"
  - "float:"
  - "-webkit-"

forbidden_tags:        # 会被微信编辑器剥离的危险标签（lint 以 "<tag" 形式检查）
  - style
  - script
  - iframe
  - form
  - input
  - button
  - object
  - embed
  - link
  - meta
  - noscript

# ------------------------------------------------------------
# 正文排版约束（列于此便于 agent/skill 一次读取）
# ------------------------------------------------------------
constraints:
  inline_only: true                # 公众号不支持 <style> 块和 class（除主题通过 juice 胶水内联化）
  font_size_body: 15
  line_height_range: [1.75, 2.0]
  letter_spacing: 1
  paragraph_margin_range: [15, 20]
