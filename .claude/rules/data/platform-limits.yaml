# ============================================================
# 平台数值阈值（单一事实来源 · 多平台）
# 消费者：lint.py（typography/svg/css_safety/length_limit）、
#         writer/auditor/polisher/publisher/illustrator agent、
#         typeset-authoring skill
#
# 设计原则：
# - 本文件只放"数值阈值"。lint 的 enabled/severity/message 在 framework/config/platform-lint-rules.yaml
# - 新平台只需在 platforms.{name} 下加一段
# - defaults 段为缺省值，平台段缺字段时回退（便于新平台只覆盖差异）
# ============================================================

version: "3.0"

# 跨平台默认（平台段缺字段时回退到此处）
defaults:
  length_limit_factor: 1.1       # 软上限：超 length_limit × 此系数 → warning（创作弹性，允许 ±10%）
  length_hard_factor: 1.2        # 硬上限：超 length_limit × 此系数 → error（必须压缩，超 +20%）
  paragraph:
    no_first_line_indent: true
  sentence:
    split_at: ["但是", "因此", "所以", "，"]
  headings:
    allowed: [2, 3, 4]

# ============================================================
# 平台段 — 新平台只加一段
# ============================================================

platforms:

  # ----------------------------------------------------------
  # WeChat 公众号（最严：CSS 安全 + SVG 可读性 + 段落硬约束）
  # ----------------------------------------------------------
  wechat:
    paragraph:
      max_chars: 120              # ≈3 行 × 40 字/行 @15px/640px
      no_first_line_indent: true
    sentence:
      max_chars: 40
      split_at: ["但是", "因此", "所以", "，"]
    headings:
      allowed: [2, 3, 4]          # H1 仅用于文章标题
    image:
      max_width: 640
    # SVG 可读性（640→375 缩放系数 ≈0.586）
    svg:
      min_font_size: 14           # 正文/数据标签（硬下限，lint 报 error）
      caption_font_size: 12       # 图注/脚注（warning 可人工放行）
      title_font_size: 18
      section_font_size: 16
      min_font_weight: 400
      max_font_variants: 4
      font_stack: '"Microsoft YaHei","PingFang SC",sans-serif'
    # SVG 微信特有约束（保留作为规范声明；illustrator 现以 SVG→PNG 转换规避）
    svg_wechat:
      forbid_id_attribute: true
      forbid_style_tag: true
      forbid_script_tag: true
      forbid_anchor_tag: true
      background_url_no_quotes: true
    # CSS 安全（lint.py rule_css_safety 消费）
    forbidden_css:
      - "position:"
      - "@media"
      - "@keyframes"
      - ":hover"
      - ":active"
      - "float:"
      - "-webkit-"
    forbidden_tags:               # 微信编辑器会剥离的危险标签
      - style
      - script
      - iframe
      - form
      - input
      - button
      - object
      - embed
      - link
      - meta
      - noscript
    # 正文排版（agent/skill 一次读取）
    constraints:
      inline_only: true
      font_size_body: 15
      line_height_range: [1.75, 2.0]
      letter_spacing: 1
      paragraph_margin_range: [15, 20]
    length_limit_factor: 1.1
    length_hard_factor: 1.2

  # ----------------------------------------------------------
  # 小红书（短图文：硬约束段落 + 禁代码块）
  # ----------------------------------------------------------
  xiaohongshu:
    paragraph:
      max_chars: 30               # 移动端竖版气泡视觉
    sentence:
      max_chars: 30
    headings:
      allowed: [2, 3]             # 仅渲染到 H3
    length_limit_factor: 1.1
    length_hard_factor: 1.2

  # ----------------------------------------------------------
  # 知乎（长文深度：宽松段落 + Alert 降级 + 辩证）
  # ----------------------------------------------------------
  zhihu:
    paragraph:
      max_chars: 500              # 知乎段落可以很长
    sentence:
      max_chars: 50
    headings:
      allowed: [2, 3, 4]
    length_limit_factor: 1.1
    length_hard_factor: 1.2

  # ----------------------------------------------------------
  # 掘金（技术实战：宽松段落 + 代码块必标语言）
  # ----------------------------------------------------------
  juejin:
    paragraph:
      max_chars: 300
    sentence:
      max_chars: 45
    headings:
      allowed: [2, 3, 4]
    length_limit_factor: 1.1
    length_hard_factor: 1.2
