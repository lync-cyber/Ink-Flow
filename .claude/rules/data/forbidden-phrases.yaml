# ============================================================
# 禁用词清单（单一事实来源）
# 消费者：.claude/skills/quality-linting/scripts/lint.py（确定性校验）、auditor agent（AI 味检测）
# 修改位置：只在此文件增删，其他文件引用此处
# ============================================================

version: "1.0"

# 套话词
clichés:
  - "值得注意的是"
  - "显而易见"
  - "毋庸置疑"
  - "不难发现"
  - "综上所述"
  - "众所周知"
  - "不可否认"
  - "不得不说"
  - "无可避免"
  - "这无疑是"
  - "毫无疑问"
  - "不言而喻"

# 万能短语
vague:
  - "从某种意义上说"
  - "在一定程度上"
  - "未来可期"
  - "让我们拭目以待"
  - "相信未来"

# AI 特征词
ai_tells:
  - "这表明"
  - "由此可见"
  - "通过以上分析"
  - "不难看出"
  - "这说明"

# 过渡废话
filler:
  - "接下来我们来看"
  - "可以看到"
  - "需要注意的是"

# 结尾套话
closing_cliches:
  - "希望本文对你有所帮助"

# 句式层面的禁用（需要 LLM 语境判断，lint 不做）
# auditor 在"AI 味检测"环节使用
sentence_patterns:
  opening:
    - "定义概念：'X 是一种...'"
    - "宏观背景：'随着 X 的发展...'"
    - "流水账：'今天我们来聊聊...'"
    - "宣言式：'X 正在改变...'"
  middle:
    - "三段式排比"
    - "机械首先-其次-最后"
    - "代码后'可以看到'"
  closing:
    - "空洞总结（综上所述）"
    - "展望套话（未来，随着）"
    - "号召式（希望本文对你有所帮助）"

terminology_rule: "首次使用专业术语必须在括号内或下一句解释；连续 3+ 个缩写/英文术语无解释则违规。"
