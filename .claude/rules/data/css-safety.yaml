# ============================================================
# CSS / HTML 安全清单（单一事实来源）
# 消费者：tools/lint、writer/polisher/auditor agent、column-designing skill
# ============================================================

version: "2.0"

# ------------------------------------------------------------
# HTML 标签白名单（粘贴到微信公众号后可稳定保留）
# ------------------------------------------------------------
allowed_tags:
  - p
  - section
  - div
  - span
  - h1
  - h2
  - h3
  - h4
  - h5
  - h6
  - strong
  - b
  - em
  - i
  - u
  - br
  - hr
  - ul
  - ol
  - li
  - blockquote
  - a
  - img
  - table
  - thead
  - tbody
  - tr
  - th
  - td
  - code
  - pre
  - sub
  - sup
  - mpvoice
  - mpvideo

# 会被微信编辑器剥离的危险标签
forbidden_tags:
  - style
  - script
  - iframe
  - form
  - input
  - button
  - object
  - embed
  - link
  - meta
  - noscript

# ------------------------------------------------------------
# CSS 属性白名单
# ------------------------------------------------------------
# stable: 粘贴后确定保留
# fragile: 粘贴后可能被忽略，组件不能把布局责任全压在它上面
# ------------------------------------------------------------
allowed_css:
  stable:
    - font-size
    - font-weight
    - font-style
    - font-family
    - color
    - background
    - background-color
    - line-height
    - letter-spacing
    - text-align
    - text-decoration
    - text-indent
    - vertical-align
    - padding
    - padding-top
    - padding-right
    - padding-bottom
    - padding-left
    - margin
    - margin-top
    - margin-right
    - margin-bottom
    - margin-left
    - border
    - border-top
    - border-right
    - border-bottom
    - border-left
    - border-radius
    - border-color
    - border-style
    - border-width
    - box-shadow
    - opacity
    - width
    - height
    - max-width
    - min-width
    - max-height
    - min-height
    - display
    - word-break
    - word-wrap
    - white-space
    - overflow
    - overflow-x
    - overflow-y
    - border-collapse
  fragile:
    - flex
    - flex-grow
    - flex-shrink
    - flex-wrap
    - flex-basis
    - flex-direction
    - justify-content
    - align-items
    - align-self
    - align-content
    - gap

# 依然保留的老字段（向下兼容 lint.py / agent prompt）
allowed: [font-size, color, font-weight, letter-spacing, margin, padding,
          line-height, text-align, border-radius, box-shadow, opacity, border]
cautious: [transform, linear-gradient]

# ------------------------------------------------------------
# 禁用的 CSS（属性或具体值模式）
# ------------------------------------------------------------
forbidden_css:
  - "position:"       # 粘贴后被剥离
  - "@media"
  - "@keyframes"
  - ":hover"
  - ":active"
  - "float:"
  - "-webkit-"

# 正则级别的 value 检测（sanitize.ts 使用）
forbidden_value_patterns:
  - pattern: 'position\s*:\s*(absolute|fixed|relative|sticky)'
    reason: "微信粘贴时剥离 position"
  - pattern: "url\\(\\s*['\"]"
    reason: "带引号的 url() 会导致整段 style 被丢弃"
  - pattern: 'transform\s*:[^;]*%'
    reason: "translate 百分比在 iOS 公众号里失效"
  - pattern: '-webkit-[a-z-]+'
    reason: "厂商前缀被清洗"
  - pattern: '@media'
  - pattern: '@keyframes'
  - pattern: 'animation\s*:'

# ------------------------------------------------------------
# 属性清洗规则（sanitize.ts 使用）
# ------------------------------------------------------------
forbidden_attrs:
  - id
  - class
  - onclick
  - onerror
  - onload
  - onmouseover
  - onfocus
  - onblur
  - onchange
  - onsubmit

# <a href> 白名单（跨域外链必须降级为"阅读原文"提示）
# 未命中白名单的 a 会被降级为 span + 文案提醒
a_href_whitelist:
  - '^https://mp\.weixin\.qq\.com/'
  - '^https://mmbiz\.qpic\.cn/'
  - '^https://channels\.weixin\.qq\.com/'
  - '^https://res\.wx\.qq\.com/'
  - '^weixin://'

# <img src> 白名单（非白名单会触发 warning，本地/data URL 必然失效）
img_src_whitelist:
  - '^https://mmbiz\.qpic\.cn/'
  - '^https://mp\.weixin\.qq\.com/'
  - '^data:image/'              # data URL 适用于 PNG/SVG → PNG 中间件
  - '^blob:'                    # 工具内部预览用，上传时会转数据
  - '^\./'                      # 本地相对路径（仅预览）
  - '^/'
  - '^[a-z]+:\\\\'              # 本地绝对路径

# ------------------------------------------------------------
# 仅使用 inline style — 公众号不支持 <style> 块和 class
# ------------------------------------------------------------
constraints:
  inline_only: true
  font_size_body: 15
  line_height_range: [1.75, 2.0]
  letter_spacing: 1
  paragraph_margin_range: [15, 20]
