# ============================================================
# 合规敏感词清单（单一事实来源 · warning-only）
# 消费者：publisher（wechat 分支终稿守门附加扫描，不阻断）
#        可选：lint.py 以 --check-sensitive 参数启用
# 维护位置：只在此文件增删
#
# 说明：
# - severity 统一为 warning；命中不阻断 publish，仅在退出 JSON 的
#   warnings[] 中提示用户自查并手动确认
# - 词表为占位骨架；请在发布前按具体业务领域补充外部权威合规资料
# - 分组 key 会被 publisher 原样回显到 warning message 中，便于溯源
# ============================================================

version: "0.1"

# 政治/时政领域（广告法 + 宣传纪律常见红线词示例位）
politics: []
  # 示例格式：
  # - word: "领导人名讳不当表述"
  #   reason: "不当提及"
  #   action: "建议换表述或删除"

# 健康/医疗（医疗广告法）
health: []

# 金融/投资（"稳赚"、"保本"、"最高收益" 等承诺式）
finance: []

# 广告法绝对化用语（"最"、"第一"、"国家级" 等）
advertising: []

# 涉黄/暴/毒敏感
sensitive_adult: []

# 用户自定义域外词（按项目需要扩展）
custom: []
