# InkFlow Pipeline — 公众号文章写作（参考实现）
# 7 阶段 + 3 检查点 + 2 条件跳过

name: article-writing
description: 公众号文章写作 pipeline

stages:
  - name: brief
    type: user_input                         # 用户填写，由编排器交互式引导

  - name: research
    agent: researcher
    skip_if: "brief.skip_research == true"   # 观点类文章可跳过调研
    context_files:
      - "articles/{slug}/brief.md"

  - name: outline
    agent: outliner
    checkpoint: true                         # ★ Checkpoint 1: 用户审核大纲
    requires: [brief]
    context_files:
      - "articles/{slug}/brief.md"
      - "articles/{slug}/research.md"
      - "styles/{style_profile}/style-profile.md"

  - name: draft
    agent: writer
    requires: [outline]
    context_files:
      - "articles/{slug}/outline.md"
      - "styles/{style_profile}/style-profile.md"

  - name: figures
    agent: illustrator
    skip_if: "brief.no_figures == true"      # 条件跳过
    requires: [outline]                      # 依赖 outline（非 draft），支持并行
    parallel_with: [draft]                   # 可与 draft 并行执行
    context_files:
      - "articles/{slug}/outline.md"

  - name: refine
    sub_agents:                              # 两个独立 subagent 顺序调用
      - agent: editor-audit
        output: "articles/{slug}/output/audit.md"
        context_files:
          - "articles/{slug}/drafts/full.md"
          - "articles/{slug}/figures/summary.md"
          - "articles/{slug}/research.md"
          - "styles/{style_profile}/style-profile.md"
      - agent: editor-polish
        input_from: [editor-audit]
        output: "articles/{slug}/output/final.md"
        context_files:
          - "articles/{slug}/drafts/full.md"
          - "articles/{slug}/output/audit.md"
          - "styles/{style_profile}/style-profile.md"
    checkpoint: true                         # ★ Checkpoint 2: 用户终审
    requires: [draft]
    sub_steps:
      - name: audit
        description: "五维审校（事实/论证/AI味/风格/句式）"
      - name: polish
        description: "去 AI 味润色"

  - name: publish
    checkpoint: true                         # ★ Checkpoint 3: 用户确认发布
    context_files:
      - "articles/{slug}/output/final.md"
      - "articles/{slug}/brief.md"

# Skill 调度配置
skills:
  global: []                                 # 全阶段可用
  stages:
    draft:
      - name: anti-ai-style
      - name: writing-strategy
      - name: style-reference
      - name: opening-hooks
        condition: "stage.section_index == 0" # 仅第一 section 注入
    refine: [de-ai-polish]
    publish:
      - name: wechat-format

# Rule 调度（纯声明式约束）
rules:
  global: [platform-base, wechat-platform, fact-check]
  stages:
    draft: [writing-quality]
    refine: [writing-quality]

# exports 和 model_allocation 已移入 .inkflow.yaml（项目级配置）
