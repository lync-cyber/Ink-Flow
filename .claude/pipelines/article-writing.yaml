# InkFlow Pipeline — 公众号文章写作（参考实现）
# 7 阶段 + 3 检查点 + 2 条件跳过

name: article-writing
description: 公众号文章写作 pipeline

stages:
  - name: brief
    type: user_input                         # 用户填写，非 agent 执行
    command: /brief

  - name: research
    agent: researcher
    command: /research
    skip_if: "brief.skip_research == true"   # 观点类文章可跳过调研

  - name: outline
    agent: outliner
    command: /outline
    checkpoint: true                         # ★ Checkpoint 1: 用户审核大纲
    requires: [brief]

  - name: draft
    agent: writer
    command: /draft
    requires: [outline]

  - name: figures
    agent: illustrator
    command: /figures
    skip_if: "brief.no_figures == true"      # 条件跳过
    requires: [outline]                      # [改进#9] 依赖 outline（非 draft），支持并行
    parallel_with: [draft]                   # [改进#9] 可与 draft 并行执行

  - name: refine                             # 合并原 /review + /polish
    sub_agents:                              # 两个独立 subagent 顺序调用
      - agent: editor-audit
        output: "output/{topic}-audit-report.md"
      - agent: editor-polish
        input_from: [editor-audit]
        output: "output/{topic}-final.md"
    command: /refine
    checkpoint: true                         # ★ Checkpoint 2: 用户终审
    requires: [draft]
    sub_steps:
      - name: audit
        description: "五维审校（事实/论证/AI味/风格/句式）"
      - name: polish
        description: "去 AI 味润色"

  - name: publish
    command: /publish
    checkpoint: true                         # ★ Checkpoint 3: 用户确认发布

# Skill 调度配置
skills:
  global: [fact-check]                       # 全阶段可用
  stages:
    draft:
      - name: anti-ai-style
      - name: style-reference
      - name: opening-hooks
        condition: "stage.section_index == 0" # [改进#10] 仅第一 section 注入
    refine: [fact-check, de-ai-polish]
    publish:
      - name: wechat-format

# Rule 调度（纯声明式约束）
rules:
  global: [platform-base, wechat-platform]
  stages:
    draft: [writing-quality]
    refine: [writing-quality]

# [改进#11] 多格式导出配置
exports:
  - format: wechat_md
    description: "Markdown Nice 适配格式（默认）"
    output: "output/{topic}-wechat.md"

  - format: plain_md
    description: "纯净 Markdown（知乎/掘金等）"
    output: "output/{topic}-plain.md"

  - format: html
    description: "内联样式 HTML（可直接粘贴公众号编辑器）"
    output: "output/{topic}.html"

  - format: summary
    description: "短摘要版（朋友圈/社群分发）"
    output: "output/{topic}-summary.md"
    word_limit: 200

# 模型分配策略
model_allocation:
  researcher: sonnet
  outliner: opus
  writer: opus
  illustrator: sonnet
  editor-audit: opus
  editor-polish: opus
  style-analyzer: opus
  semantic_check: haiku              # L2 语义校验用最低成本模型
