# InkFlow Markdown Lint 配置
# 只保留规则开关和严重级别；所有数据（禁用词、CSS 属性、阈值）来自 .claude/rules/data/*.yaml
# lint.py 在加载时合并 data 文件，构造完整配置

rules:
  forbidden_blocks:
    enabled: true
    severity: error
    # 任何 ^::: 容器语法均视为错误（粘贴到微信必失效）

  gfm_alerts:
    enabled: true
    severity: warning
    allowed_types:
      - NOTE
      - TIP
      - IMPORTANT
      - WARNING
      - CAUTION

  typography:
    enabled: true
    severity: warning
    # 阈值来源：.claude/rules/data/platform-limits.yaml

  theme_constraints:
    enabled: true
    severity: error

  image_references:
    enabled: true
    severity: warning

  css_safety:
    enabled: true
    severity: error
    # 属性/值/标签黑名单来源：.claude/rules/data/platform-limits.yaml

  article_structure:
    enabled: true
    severity: warning

  svg_readability:
    enabled: true
    severity: error
    # 字号阈值来源：.claude/rules/data/platform-limits.yaml 的 svg 段

  forbidden_patterns:
    enabled: true
    severity: warning
    # 词表来源：.claude/rules/data/forbidden-phrases.yaml

# 栏目特有覆盖（业务语义，不属于可复用 data）
column_overrides:
  学术前沿:
    theme_constraints:
      require_references: true
      require_tldr: true
