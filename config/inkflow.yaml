# ============================================================
# InkFlow 项目配置（合并了原 .inkflow.yaml + stage-contracts.yaml）
# 单一事实来源：stages 字段既定义流程也定义合约与校验
# ============================================================

# workspace_mode: framework — 框架开发模式（articles/ 被 gitignore）
# workspace_mode: content — 内容创作模式（articles/ 纳入版本管理）
workspace_mode: content

domains:
  - wechat-article

# 模型分配（权威来源 — agent frontmatter 的 model 字段必须与此保持一致）
model_allocation:
  orchestrator: opus
  researcher: sonnet
  outliner: opus
  writer: opus
  illustrator: sonnet
  auditor: opus
  polisher: sonnet
  publisher: sonnet

# Brief 默认字段
defaults:
  target_length: 1500
  content_type: deep_dive
  audience: tech_intermediate
  skip_research: false
  no_figures: false
  skip_seo: false
  publish_timing: evening
  cta_type: follow
  cover_style: auto
  style_profile: default
  opening_style: auto

# ============================================================
# 工作流阶段 — 既是执行顺序，也是合约
# agent：该阶段由哪个 agent 执行（user_input 表示由 orchestrator 直接生成）
# output：产物路径（使用 artifact-layout.yaml 的路径占位）
# requires：依赖阶段
# skip_if：跳过条件（从 brief frontmatter 读值）
# parallel_with：可并行执行
# checkpoint：true 表示需用户审核才能推进
# validation：orchestrator 在 agent 完成后独立校验，与 agent 上下文隔离
# ============================================================
stages:
  - name: brief
    type: user_input
    output: "articles/{slug}/intermediate/brief.md"

  - name: research
    agent: researcher
    skip_if: "brief.skip_research == true"
    output: "articles/{slug}/intermediate/research.md"
    validation:
      required_sections: ["关键事实", "代码片段", "对比表格", "不确定项"]
      optional_sections:
        - name: "SEO 关键词"
          skip_if: "brief.skip_seo == true"
        - name: "竞品分析"
          skip_if: "brief.content_type == opinion || brief.content_column == story"
      word_count: { min: 500, max: 5000 }
      required_patterns: ["\\[来源\\]\\(http"]
      forbidden_patterns: ["TODO", "待补充"]

  - name: outline
    agent: outliner
    checkpoint: true
    requires: [brief]
    output: "articles/{slug}/intermediate/outline.md"
    validation:
      required_sections: ["总览"]
      required_per_section: ["论点", "关键细节", "预估字数", "视觉断点"]
      word_count: { min: 300, max: 2000 }
      forbidden_patterns: ["TODO"]

  - name: draft
    agent: writer
    requires: [outline]
    output: "articles/{slug}/intermediate/draft/merged.md"
    section_output: "articles/{slug}/intermediate/draft/section-{N}.md"
    validation:
      section_tolerance: 0.20
      merged_word_count: { min: 800, max: 5000 }
      forbidden_patterns: ["TODO"]
      forbidden_phrases_from: .claude/rules/data/forbidden-phrases.yaml

  - name: figures
    agent: illustrator
    skip_if: "brief.no_figures == true"
    requires: [outline]
    parallel_with: [draft]
    output: "articles/{slug}/intermediate/figure/index.md"
    individual_output: "articles/{slug}/intermediate/figure/fig-{N}.{md|svg}"
    validation:
      required_patterns: ["```mermaid|<svg"]

  - name: audit
    agent: auditor
    requires: [draft]
    output: "articles/{slug}/review/audit.md"
    validation:
      required_sections: ["审校报告", "事实准确性", "论证完整性", "AI 味检测", "风格偏离", "句式问题", "传播性评估", "审校统计"]
      severity_levels: [高, 中, 低]
      issue_table_header: "| 序号 | 位置 | 问题描述 | 严重性 | 修改建议 |"

  - name: polish
    agent: polisher
    checkpoint: true
    requires: [audit]
    output: "articles/{slug}/review/polish-trace.md"
    final_output: "articles/{slug}/export/final.md"
    validation:
      required_sections: ["润色结果", "变更溯源表", "润色变更摘要"]
      forbidden_patterns: ["TODO", "待确认"]
      forbidden_phrases_from: .claude/rules/data/forbidden-phrases.yaml
      platform_checks:
        - type: css_safety
          source: .claude/rules/data/css-safety.yaml
        - type: heading_level
          source: .claude/rules/data/typography-limits.yaml
        - type: image_width
          source: .claude/rules/data/typography-limits.yaml

  - name: publish
    agent: publisher
    checkpoint: true
    requires: [polish]
    output: "articles/{slug}/export/wechat.md"
    additional_outputs:
      - "articles/{slug}/export/plain.md"
      - "articles/{slug}/export/teaser.md"
    validation:
      required_patterns: ["^# "]
      forbidden_patterns:
        - "<!-- FIGURE:"
        - "<!-- MEDIA:"
        - "<!-- USER_FILL:"
        - '<img src="\.\./'
        - '<svg[^>]* id='

# ============================================================
# 导出格式（publish 阶段使用）
# ============================================================
exports:
  - format: wechat_md
    description: "Markdown Nice 适配格式"
    output: "articles/{slug}/export/wechat.md"
  - format: plain_md
    description: "纯净 Markdown（知乎/掘金等）"
    output: "articles/{slug}/export/plain.md"
  - format: teaser
    description: "短摘要版（朋友圈/社群分发）"
    output: "articles/{slug}/export/teaser.md"
    word_limit: 120

# ============================================================
# Skill 注册表
# ============================================================
registry:
  skills_paths: [.claude/skills]
  rules_paths:  [.claude/rules]

# ============================================================
# 路径常量（全局使用）
# ============================================================
paths:
  articles_root: articles
  state_dir: workspace/pipeline-states
  retro_dir: retro
  references_dir: references
  style_profile: styles/default/style-profile.md
  columns_config: config/columns.yaml
  markdown_extensions: config/markdown-extensions.md
  artifact_layout: config/artifact-layout.yaml
