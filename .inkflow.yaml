# InkFlow 项目配置
# 用于标识该目录为 InkFlow 工作区
version: "1.0.0"

# 启用的领域包
domains:
  - wechat-article

# 模型分配策略（跨 pipeline 复用）
model_allocation:
  orchestrator: opus
  researcher: sonnet
  outliner: opus
  writer: opus
  illustrator: sonnet
  auditor: opus
  polisher: sonnet
  publisher: sonnet

# 多格式导出配置（跨 pipeline 复用）
exports:
  - format: wechat_md
    description: "Markdown Nice 适配格式（默认）"
    output: "articles/{slug}/output/article.md"

  - format: plain_md
    description: "纯净 Markdown（知乎/掘金等）"
    output: "articles/{slug}/output/plain.md"

  # html 格式由 typesetter（tools/wechat-typesetter/index.html）程序化生成，不在 pipeline 内导出

  - format: summary
    description: "短摘要版（朋友圈/社群分发）"
    output: "articles/{slug}/output/summary.md"
    word_limit: 120   # 公众号截断限制，全局唯一定义

# Brief 字段默认值（减少每次填写量）
defaults:
  target_length: 1500
  content_type: deep_dive
  audience: tech_intermediate
  skip_research: false
  no_figures: false
  skip_seo: false
  publish_timing: evening
  cta_type: follow
  cover_style: auto
  style_profile: default
  opening_style: auto

# 工作流阶段定义
# validation 由编排器在 agent 完成后独立执行，与 agent 上下文隔离
stages:
  - name: brief
    type: user_input

  - name: research
    agent: researcher
    skip_if: "brief.skip_research == true"
    validation:
      required_sections:
        - "关键事实"
        - "代码片段"
        - "对比表格"
        - "不确定项"
      optional_sections:
        - name: "SEO 关键词"
          skip_if: "brief.skip_seo == true"
        - name: "竞品分析"
          skip_if: "brief.content_type == opinion || brief.content_column == story"
      word_count: { min: 500, max: 5000 }
      required_patterns:
        - "\\[来源\\]\\(http"
      forbidden_patterns: ["TODO", "待补充"]

  - name: outline
    agent: outliner
    checkpoint: true
    requires: [brief]
    validation:
      required_sections: ["总览"]
      required_patterns:
        - "- 论点:"
        - "- 关键细节:"
        - "- 预估字数:"
        - "- 视觉断点:"
      word_count: { min: 300, max: 2000 }
      forbidden_patterns: ["TODO"]

  - name: draft
    agent: writer
    requires: [outline]
    validation:
      section_tolerance: 0.20  # 每个 section 字数与大纲预估偏差 ≤ 20%
      merged_word_count: { min: 800, max: 5000 }  # 合并后 full.md 总字符数
      forbidden_patterns: ["TODO"]
      forbidden_patterns_from_rules:
        - .claude/rules/domains/wechat-article/quality-redline.md

  - name: figures
    agent: illustrator
    skip_if: "brief.no_figures == true"
    requires: [outline]
    parallel_with: [draft]
    validation:
      required_patterns:
        - "```mermaid|<svg"

  - name: audit
    agent: auditor
    requires: [draft]
    validation:
      required_sections: ["审校报告", "传播性评估", "审校统计"]

  - name: polish
    agent: polisher
    checkpoint: true
    requires: [audit]
    validation:
      required_sections: ["润色结果"]
      forbidden_patterns: ["TODO", "待确认"]
      forbidden_patterns_from_rules:
        - .claude/rules/domains/wechat-article/quality-redline.md
      platform_checks:
        - type: css_safety
          source: tools/markdown-lint/lint-config.yaml  # 单一事实来源，不重复定义 forbidden_css
        - type: heading_level
          allowed: ["##", "###", "####"]
        - type: image_width
          max_width: 640

  - name: publish
    agent: publisher
    checkpoint: true
    requires: [polish]

# Skill 注册表
registry:
  skills_paths:
    - .claude/skills

# 用户级覆盖（可选）
# overrides:
#   agents:
#     writer:
#       forbidden_patterns_append: [...]
