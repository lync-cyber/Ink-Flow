# InkFlow 项目配置
# 用于标识该目录为 InkFlow 工作区
# 版本号由 git tag 管理（如 v1.0.0），不在此文件中硬编码

# workspace_mode: framework — InkFlow 框架开发模式（articles/ 被 gitignore）
# workspace_mode: content — 内容创作模式（articles/ 纳入版本管理）
workspace_mode: framework

# 启用的领域包
domains:
  - wechat-article

# 多格式导出配置（跨 pipeline 复用）
exports:
  - format: wechat_md
    description: "Markdown Nice 适配格式（默认）"
    output: "articles/{slug}/output/article.md"

  - format: plain_md
    description: "纯净 Markdown（知乎/掘金等）"
    output: "articles/{slug}/output/plain.md"

  # html 格式由 typesetter（tools/wechat-typesetter/index.html）程序化生成，不在 pipeline 内导出

  - format: summary
    description: "短摘要版（朋友圈/社群分发）"
    output: "articles/{slug}/output/summary.md"
    word_limit: 120   # 公众号截断限制，全局唯一定义

# Brief 字段默认值（减少每次填写量）
defaults:
  target_length: 1500
  content_type: deep_dive
  audience: tech_intermediate
  skip_research: false
  no_figures: false
  skip_seo: false
  publish_timing: evening
  cta_type: follow
  cover_style: auto
  style_profile: default
  opening_style: auto

# 工作流阶段定义
# validation 规则统一定义在 stage-contracts.yaml（单一事实来源）
# 编排器在 agent 完成后读取合约独立执行校验，与 agent 上下文隔离
contracts_source: styles/default/stage-contracts.yaml

stages:
  - name: brief
    type: user_input
    contract_ref: brief

  - name: research
    agent: researcher
    skip_if: "brief.skip_research == true"
    contract_ref: research

  - name: outline
    agent: outliner
    checkpoint: true
    requires: [brief]
    contract_ref: outline

  - name: draft
    agent: writer
    requires: [outline]
    contract_ref: draft

  - name: figures
    agent: illustrator
    skip_if: "brief.no_figures == true"
    requires: [outline]
    parallel_with: [draft]
    contract_ref: figures

  - name: audit
    agent: auditor
    requires: [draft]
    contract_ref: audit

  - name: polish
    agent: polisher
    checkpoint: true
    requires: [audit]
    contract_ref: polish

  - name: publish
    agent: publisher
    checkpoint: true
    requires: [polish]
    contract_ref: publish

# Skill 注册表
registry:
  skills_paths:
    - .claude/skills

# 用户级覆盖（可选）
