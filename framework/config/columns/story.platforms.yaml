# ============================================================
# story 栏目 · 多平台适配层
# ============================================================

column: story
version: "1.0"

platforms:

  wechat:
    skeleton:
      - "一句话核心观点 [atom: claims.primary]       # 带立场，不软化"
      - "故事/场景 [atom: cases×1-3]                 # 时间+场景+转折"
      - "反思与分析 [atom: analogies + pitfalls]"
      - "我现在怎么做 [atom: actions]                # 行为层面"
      - "给同行的建议 [atom: actions]                # 第二人称"
      - "收尾"
    tone:
      voice: "对话感，像给朋友聊天"
      rules:
        - "禁止「笔者」 → 改为「我」"
        - "禁止'某次项目' → 改为「2024 年某个深夜...」具体场景"
        - "禁止软化观点（'可能有一些局限性'） → 改为「X 不好」"
    kpi_targets:
      share_rate: 0.10
      min_comments: 15
    atom_selection: [claims, cases, analogies, pitfalls, actions]
    length_limit: 2200
    figure_spec:
      aspect: "16:9"
      formats: [png]
      style_hint: "真实照片/场景插画（image-prompt 主导）"

  xiaohongshu:
    skeleton:
      - "封面金句 [atom: quotes×1]                   # 共鸣感强"
      - "场景切片 [atom: cases×1]                    # 1 段故事压缩"
      - "关键转折 [atom: claims.primary]"
      - "给同类人的话 [atom: actions]"
      - "话题标签"
    tone:
      voice: "日记感、私密感"
      rules:
        - "禁止说教 → 改为分享"
        - "禁止泛泛共鸣 → 必有 1 个具体细节（时间/地点/对话）"
        - "禁止结尾硬抽金句 → 改为留白 + 提问"
    kpi_targets:
      save_rate: 0.08
      engagement_rate: 0.15
    atom_selection: [quotes, cases, claims, actions]
    length_limit: 400
    figure_spec:
      aspect: "3:4 竖版"
      formats: [png]
      cover_required: true
      style_hint: "真实感照片 / 手写字 / 暖色调"

  zhihu:
    skeleton:
      - "结论先行 [atom: claims.primary]"
      - "故事展开 [atom: cases×2-3]                   # 保留叙事"
      - "深层分析 [atom: analogies + pitfalls]"
      - "我的做法与反思 [atom: actions]"
      - "给读者的开放式问题"
    tone:
      voice: "真诚、有反思深度"
      rules:
        - "禁止鸡汤 → 改为具体场景 + 可复现行为"
        - "禁止单角度 → 补一段'但反过来想'的自我质疑"
        - "禁止结尾'希望有所帮助' → 改为真诚提问"
    kpi_targets:
      upvote_rate: 0.12
      comment_rate: 0.10
    atom_selection: [claims, cases, analogies, pitfalls, actions]
    length_limit: 3500
    figure_spec:
      formats: [png, md]

  juejin:
    # 人物故事在掘金偏"程序员职业/成长"方向；纯生活故事不建议分发到掘金
    applicable: conditional
    applicable_if: "brief.story_subtype in [career, technical_growth, team_incident]"
    skeleton:
      - "TL;DR [atom: claims.primary]                # 职业/成长的一句话教训"
      - "背景 [atom: cases×1]                         # 技术/团队场景"
      - "经过 + 关键决策 [atom: cases + pitfalls]"
      - "复盘 [atom: actions]                         # 技术/流程改进"
      - "给同行的 checklist"
    tone:
      voice: "复盘感、技术落点"
      rules:
        - "禁止纯情感抒发 → 必有 1 个技术/流程层面的改进"
        - "禁止不具名描述 → 必有技术栈/规模/时长具体信息"
        - "禁止结尾煽情 → 改为 checklist 或流程图"
    kpi_targets:
      like_rate: 0.05
      bookmark_rate: 0.08
    atom_selection: [claims, cases, pitfalls, actions]
    length_limit: 2000
