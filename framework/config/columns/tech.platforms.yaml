# ============================================================
# tech 栏目 · 多平台适配层
#
# 消费者：outliner / writer / illustrator / auditor / polisher / publisher
# 加载入口：columns.yaml 的 `columns.tech.platforms_config` 指向本文件
# ============================================================

column: tech
version: "1.0"

platforms:

  wechat:
    skeleton:
      - "一句话结论 [atom: claims.primary]"
      - "问题定义 [atom: cases + pitfalls×1]"
      - "方案详解 [atom: evidence-code + evidence-data]"
      - "性能验证 [atom: evidence-data.hero]"
      - "避坑要点 [atom: pitfalls×2-3]"
      - "收尾 [atom: actions]"
    tone:
      voice: "实用、直接，像给同事讲经验"
      rules:
        - "禁止描述型标题 → 改为动作型（X 实战：解决 Y）"
        - "禁止连续 3 行无代码的技术段落 → 改为 2 行 + 代码块"
        - "禁止'可以看到' → 直接描述看到的"
    kpi_targets:
      completion_rate: 0.35
      bookmark_rate: 0.08
    atom_selection: [claims, evidence-data, evidence-code, cases, pitfalls, comparison, actions]
    length_limit: 1500
    figure_spec:
      aspect: "16:9 或 3:2"
      formats: [svg, html, png]
      max_width_px: 640

  xiaohongshu:
    skeleton:
      - "封面金句 [atom: quotes×1]                  # ≤20 字引爆"
      - "痛点场景 [atom: cases×1]                   # 1 段内，可加 emoji"
      - "干货清单 [atom: actions + pitfalls 混选 3-5 条]"
      - "行动 CTA + 话题标签"
    tone:
      voice: "干脆、有标签感、第二人称"
      rules:
        - "禁止代码块 → 改为截图建议（// 贴截图：配置第 X 行）"
        - "禁止段落超过 30 字 → 改为 bullet"
        - "禁止未解释的英文术语 → 改为一句大白话定义"
        - "禁止结尾煽情 → 改为 3 个话题标签"
    kpi_targets:
      save_rate: 0.12
      follow_rate: 0.03
    atom_selection: [quotes, cases, actions, pitfalls]
    length_limit: 500
    figure_spec:
      aspect: "3:4 竖版"
      formats: [png]          # 不接受 SVG（小红书无矢量渲染）
      cover_required: true
      style_hint: "色块 + 大字 + 无代码截图"

  zhihu:
    skeleton:
      - "结论先行 [atom: claims.primary]"
      - "问题定义 [atom: cases + analogies]"
      - "方案详解 [atom: evidence-code + evidence-data + comparison]"
      - "反对意见 [atom: pitfalls]                  # 主动回应质疑"
      - "总结 + 延伸问题"
    tone:
      voice: "深入、辩证、不卖弄"
      rules:
        - "禁止单一视角 → 改为至少 2 种观点对比（必引 comparison）"
        - "禁止结论无过程 → 改为「结论 + 3 条证据链」"
        - "禁止结尾'希望对你有所帮助' → 改为延伸问题"
    kpi_targets:
      upvote_rate: 0.08
      collect_rate: 0.04
    atom_selection: [claims, evidence-data, evidence-code, cases, analogies, pitfalls, comparison, actions]
    length_limit: 3500
    figure_spec:
      aspect: "任意"
      formats: [md, png]      # 知乎原生支持 markdown 图表，代码用围栏无需截图
      inline_code_ok: true

  juejin:
    skeleton:
      # 用"一句话结论"取代 "TL;DR"——writer.md 明确禁止 "TL;DR" 作为正文词
      - "一句话结论 [atom: claims.primary]           # ≤3 行"
      - "背景问题 [atom: cases×1]"
      - "核心实现 [atom: evidence-code + 分步骤]"
      - "踩坑与解决 [atom: pitfalls]"
      - "完整示例 + 仓库链接 [atom: actions]"
    tone:
      voice: "工程师对工程师，代码优先"
      rules:
        - "禁止无代码结论 → 改为「代码片段 + 1 行注释」"
        - "禁止空话 → 改为版本号/依赖清单/环境说明"
        - "禁止结尾煽情 → 改为 GitHub/文档链接"
    kpi_targets:
      like_rate: 0.06
      bookmark_rate: 0.10
    atom_selection: [claims, evidence-code, cases, pitfalls, comparison, actions]
    length_limit: 2500
    figure_spec:
      aspect: "任意"
      formats: [md, png]
      inline_code_ok: true
      code_screenshot_ok: true
