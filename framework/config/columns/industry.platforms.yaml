# ============================================================
# industry 栏目 · 多平台适配层
# ============================================================

column: industry
version: "1.0"

platforms:

  wechat:
    skeleton:
      - "一句话判断 [atom: claims.primary]"
      - "发生了什么 [atom: evidence-data + cases]         # 信号+时间"
      - "为什么重要 [atom: analogies + comparison]"
      - "谁会受影响 [atom: cases + actions]                # 分角色"
      - "行动建议 [atom: actions]"
      - "收尾"
    tone:
      voice: "有立场、不中立"
      rules:
        - "禁止'面临一定挑战' → 改为「X 将被边缘化，Y 获益」"
        - "禁止单信号综述 → 改为「三个独立信号指向同一方向」"
        - "禁止无时间戳数据 → 必标 (YYYY-MM) 时效"
    kpi_targets:
      open_rate: 0.15
      share_rate: 0.08
    atom_selection: [claims, evidence-data, cases, analogies, comparison, actions]
    length_limit: 1200

  xiaohongshu:
    skeleton:
      - "封面金句 [atom: quotes×1]                  # 冲突性判断"
      - "三个信号 [atom: evidence-data×3]             # 简报式"
      - "你该怎么做 [atom: actions×2-3]"
      - "话题标签"
    tone:
      voice: "危机感 + 行动感"
      rules:
        - "禁止中性 → 改为「X 正在被淘汰」这类有冲击力表述"
        - "禁止无数字 → 每条信号带一个精确数字"
        - "禁止结尾平淡 → 改为'快存，不然下次刷不到'之类的保存钩子"
    kpi_targets:
      save_rate: 0.15
      follow_rate: 0.04
    atom_selection: [quotes, evidence-data, claims, actions]
    length_limit: 450
    figure_spec:
      aspect: "3:4 竖版"
      formats: [png]
      cover_required: true
      style_hint: "红黄冲突色 + 三栏对比大字"

  zhihu:
    skeleton:
      - "结论先行 [atom: claims.primary]"
      - "信号汇总 [atom: evidence-data×3+]           # 多源共振"
      - "影响链分析 [atom: comparison + analogies]"
      - "不同角色的应对 [atom: cases + actions]"
      - "反方意见 [atom: pitfalls]                    # 主动回应质疑"
      - "总结 + 延伸问题"
    tone:
      voice: "分析师风格、辩证"
      rules:
        - "禁止单来源结论 → 改为「≥3 来源共振」引用规范"
        - "禁止无反驳 → 必有至少 1 个反方观点并回应"
        - "禁止结尾煽情 → 改为延伸问题"
    kpi_targets:
      upvote_rate: 0.09
      collect_rate: 0.05
    atom_selection: [claims, evidence-data, cases, analogies, pitfalls, comparison, actions]
    length_limit: 3000

  juejin:
    # 行业趋势在掘金聚焦技术栈变化，不做商业解读
    skeleton:
      - "TL;DR [atom: claims.primary]              # 技术栈变化一句话"
      - "技术信号 [atom: evidence-data + evidence-code]"
      - "工程影响 [atom: cases + actions]"
      - "迁移建议 [atom: actions]"
      - "延伸阅读"
    tone:
      voice: "工程师视角的趋势判断"
      rules:
        - "禁止商业语言（市占/融资） → 改为技术指标（性能/DX/生态）"
        - "禁止无代码示例 → 必附新旧写法对比片段"
        - "禁止无迁移成本评估 → 必含工作量估算"
    kpi_targets:
      like_rate: 0.05
      bookmark_rate: 0.07
    atom_selection: [claims, evidence-code, evidence-data, cases, comparison, actions]
    length_limit: 1800
    figure_spec:
      inline_code_ok: true
      code_comparison_ok: true
