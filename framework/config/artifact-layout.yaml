# ============================================================
# 文章产物布局（单一事实来源）
# 所有 agent 通过此文件获取产物路径，不硬编码
# ============================================================
#
# 命名约定：
#   {NN}-{stage-semantic}.md — 数字前缀对应 pipeline 阶段，后缀说明语义
#   参与并行的阶段（draft / figure）用 {N}a / {N}b 区分
#
# 目录语义：
#   intermediate/  — 中间产物，可从 pipeline 重生成
#   review/        — 审校产物（与 draft 配对，不可丢）
#   export/        — 最终产物，可直接发布使用
#
# 阶段映射：
#   01 brief          02 research        03 outline  [CP1]
#   04a draft  ∥  04b figure
#   05 audit          06 polish  [CP2]   07 final-manuscript
#   08 publish (wechat/plain/teaser)  [CP3]
#
# wechat 产物包含 ::: 容器 + 5 行内扩展；用户粘贴到 wechat-typeset 本地编辑器
# 切主题复制。
# ============================================================

version: "2.1"

root: "content/articles/{slug}"

# 占位变量：
#   {slug}      — 文章 slug
#   {N}         — 序号（两位零填充）
#   {ext}       — 文件扩展名
#   {platform}  — 目标平台（brief.target_platforms 之一；wechat / xiaohongshu / zhihu / juejin）

paths:
  # ---- 元数据 ----
  meta:           "content/articles/{slug}/_meta.yaml"

  # ---- 中间产物 · 平台无关 ----
  brief:          "content/articles/{slug}/intermediate/01-brief.md"
  research:       "content/articles/{slug}/intermediate/02-research-memo.md"

  # atoms · 内容银行（分叉前最后一次统一产物）
  atoms_index:    "content/articles/{slug}/intermediate/02-atoms/index.md"
  atoms_item:     "content/articles/{slug}/intermediate/02-atoms/{type}.md"   # {type} ∈ 9 类

  # ---- 中间产物 · 平台相关（outline 起每平台独立） ----
  outline:        "content/articles/{slug}/intermediate/03-outline/{platform}.md"
  draft_section:  "content/articles/{slug}/intermediate/04a-draft/{platform}/section-{N}.md"
  draft_merged:   "content/articles/{slug}/intermediate/04a-draft/{platform}/merged-draft.md"
  figure_item:    "content/articles/{slug}/intermediate/04b-figure/{platform}/fig-{N}.{ext}"
  figure_index:   "content/articles/{slug}/intermediate/04b-figure/{platform}/figure-index.md"

  # ---- 审校产物 · 平台相关 ----
  audit:          "content/articles/{slug}/review/05-audit/{platform}.md"
  polish_trace:   "content/articles/{slug}/review/06-polish/{platform}.md"

  # ---- 最终产物 · 平台相关（polish + publish 阶段） ----
  final:          "content/articles/{slug}/export/07-final/{platform}.md"
  publish:        "content/articles/{slug}/export/08-{platform}-publish.md"
  teaser:         "content/articles/{slug}/export/08-teaser-120chars.md"        # 平台无关的短摘要

# ---- Atoms 类型枚举（供 lint / orchestrator 读取）----
atom_types:
  - claims
  - evidence-data
  - evidence-code
  - cases
  - analogies
  - quotes
  - pitfalls
  - comparison
  - actions

# ---- 平台白名单（brief.target_platforms 取值域）----
platforms:
  - wechat
  - xiaohongshu
  - zhihu
  - juejin

# ---- 运行状态 ----
state_file:       "runtime/pipeline-states/{slug}.json"
caps_cache:       "runtime/typeset-capabilities.json"

# ---- 命名规范 ----
naming:
  section_number_padding: 2      # section-01, section-02
  figure_number_padding: 2
  slug_style: kebab_or_pinyin
  platform_whitelist: [wechat, xiaohongshu, zhihu, juejin]
