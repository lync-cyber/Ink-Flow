# ============================================================
# InkFlow 项目配置（单一事实来源：stages 字段既定义流程也定义合约与校验）
# ============================================================

# workspace_mode: framework — 框架开发模式（content/articles/ 被 gitignore）
# workspace_mode: content — 内容创作模式（content/articles/ 纳入版本管理）
workspace_mode: content

domains:
  - wechat-article

# 模型分配（权威来源 — agent frontmatter 的 model 字段必须与此保持一致）
model_allocation:
  orchestrator: opus
  researcher: sonnet
  atomizer: sonnet      # 抽取 + 分类，不需 opus 判断
  outliner: opus
  writer: sonnet        # 单平台单次调用产出全部 section + 由 polisher 整体调和，sonnet 性价比更高
  illustrator: sonnet
  auditor: opus
  polisher: opus        # 在 audit 基础上做高质量改写，需要强判断
  publisher: sonnet

# Brief 默认字段
defaults:
  target_length: 1500
  content_type: deep_dive
  audience: tech_intermediate
  skip_research: false
  no_figures: false
  skip_seo: false
  cta_type: follow
  opening_style: auto
  target_platforms: [wechat]       # 多平台分发：brief 必填；默认仅 wechat
  primary_platform: wechat         # 决定 research 深度基准；必须 ∈ target_platforms

# ============================================================
# 工作流阶段 — 既是执行顺序，也是合约
# agent：该阶段由哪个 agent 执行（user_input 表示由 orchestrator 直接生成）
# output：产物路径（使用 artifact-layout.yaml 的路径占位）
# requires：依赖阶段
# skip_if：跳过条件（从 brief frontmatter 读值）
# parallel_with：可并行执行
# checkpoint：true 表示需用户审核才能推进
# validation：orchestrator 在 agent 完成后独立校验，与 agent 上下文隔离
# ============================================================
stages:
  - name: brief
    type: user_input
    output: "content/articles/{slug}/intermediate/01-brief.md"

  - name: research
    agent: researcher
    skip_if: "brief.skip_research == true"
    output: "content/articles/{slug}/intermediate/02-research-memo.md"
    validation:
      required_sections: ["关键事实", "代码片段", "对比表格", "不确定项"]
      optional_sections:
        - name: "SEO 关键词"
          skip_if: "brief.skip_seo == true"
        - name: "竞品分析"
          skip_if: "brief.content_type == opinion || brief.content_column == story"
      word_count: { min: 500, max: 5000 }
      required_patterns: ["\\[来源\\]\\(http"]
      forbidden_patterns: ["TODO", "待补充"]

  # ---- 内容银行：分叉前的最后一次"平台无关"统一产物 ----
  - name: atoms
    agent: atomizer
    requires: [research]
    skip_if: "brief.skip_research == true"        # 无 research 就无法原子化
    output: "content/articles/{slug}/intermediate/02-atoms/index.md"
    individual_outputs:
      - "content/articles/{slug}/intermediate/02-atoms/claims.md"
      - "content/articles/{slug}/intermediate/02-atoms/evidence-data.md"
      - "content/articles/{slug}/intermediate/02-atoms/evidence-code.md"
      - "content/articles/{slug}/intermediate/02-atoms/cases.md"
      - "content/articles/{slug}/intermediate/02-atoms/analogies.md"
      - "content/articles/{slug}/intermediate/02-atoms/quotes.md"
      - "content/articles/{slug}/intermediate/02-atoms/pitfalls.md"
      - "content/articles/{slug}/intermediate/02-atoms/comparison.md"
      - "content/articles/{slug}/intermediate/02-atoms/actions.md"
    validation:
      required_frontmatter_per_atom: [id, type, weight, platforms, source_section, length_chars]
      min_primary_claims: 1
      min_evidence_total: 3         # evidence-data + evidence-code + cases 合计
      forbidden_patterns: ["TODO", "待补充"]

  # ---- 分叉点：outline 起每平台独立产出 ----
  - name: outline
    agent: outliner
    per_platform: true               # fan-out from brief.target_platforms
    parallel: true
    checkpoint: true                 # CP1 合并评审 N 份 outline
    requires: [atoms, brief]
    output: "content/articles/{slug}/intermediate/03-outline/{platform}.md"
    validation:
      required_sections: ["总览", "原子引用索引", "视觉签名"]
      required_per_section: ["论点", "引用的 atoms", "预估字数"]
      required_patterns: ['atom:\s*[a-z-]+-\d{2}']   # 至少引用 1 个 atom id
      word_count: { min: 300, max: 2000 }
      forbidden_patterns: ["TODO"]

  - name: draft
    agent: writer
    per_platform: true
    parallel: true
    # writer 单次调用即产出当前平台全部 section + merged-draft；不再按 section 拆分调用
    requires: [outline]
    output: "content/articles/{slug}/intermediate/04a-draft/{platform}/merged-draft.md"
    section_output: "content/articles/{slug}/intermediate/04a-draft/{platform}/section-{N}.md"
    validation:
      section_tolerance: 0.20
      merged_word_count_from: "runtime/profile-resolved/constraints.yaml#/columnPlatforms/{column}/{platform}/lengthLimit"
      forbidden_patterns: ["TODO"]
      forbidden_phrases_from: runtime/profile-resolved/constraints.yaml#/forbidden/phrases

  - name: figures
    agent: illustrator
    per_platform: true
    parallel: true
    skip_if: "brief.no_figures == true"
    requires: [outline]
    parallel_with: [draft]
    output: "content/articles/{slug}/intermediate/04b-figure/{platform}/figure-index.md"
    individual_output:
      - "content/articles/{slug}/intermediate/04b-figure/{platform}/fig-{N}.svg"
      - "content/articles/{slug}/intermediate/04b-figure/{platform}/fig-{N}.html"
      - "content/articles/{slug}/intermediate/04b-figure/{platform}/fig-{N}.md"
      - "content/articles/{slug}/intermediate/04b-figure/{platform}/fig-{N}.png"
    validation:
      required_patterns: ["image: fig-|image: pending-user"]
      forbidden_patterns: ["```mermaid"]

  - name: audit
    agent: auditor
    per_platform: true
    parallel: true
    requires: [draft]
    output: "content/articles/{slug}/review/05-audit/{platform}.md"
    validation:
      required_sections: ["审校报告", "事实准确性", "论证完整性", "AI 味检测", "风格偏离", "句式问题", "传播性评估", "审校统计"]
      severity_levels: [高, 中, 低]
      issue_table_header: "| 序号 | 位置 | 问题描述 | 严重性 | 修改建议 |"

  - name: polish
    agent: polisher
    per_platform: true
    parallel: true
    checkpoint: true                 # CP2 合并评审 N 份终稿
    requires: [audit]
    output: "content/articles/{slug}/review/06-polish/{platform}.md"
    final_output: "content/articles/{slug}/export/07-final/{platform}.md"
    validation:
      required_sections: ["润色结果", "变更溯源表", "润色变更摘要"]
      forbidden_patterns: ["TODO", "待确认"]
      forbidden_phrases_from: runtime/profile-resolved/constraints.yaml#/forbidden/phrases
      platform_checks:
        - type: css_safety
          source: runtime/profile-resolved/typesetting.yaml#/cssSafety
        - type: heading_level
          source: runtime/profile-resolved/typesetting.yaml#/heading
        - type: image_width
          source: runtime/profile-resolved/typesetting.yaml#/imageWidth

  - name: publish
    agent: publisher
    per_platform: true
    parallel: true
    checkpoint: true                 # CP3
    requires: [polish]
    output: "content/articles/{slug}/export/08-{platform}-publish.md"
    validation:
      required_patterns: ["^# "]
      forbidden_patterns:
        - "<!-- FIGURE:"
        - "<!-- MEDIA:"
        - "<!-- USER_FILL:"
        - '<img src="\.\./'
        - '<svg[^>]* id='
      # wechat 产物允许 ::: 容器（25 个白名单内）；其他平台由 lint A1 拦截
      # 容器合法性校验由 lint.py --platform wechat 的 W1-W4 规则承担（合并进 audit 阶段）

# ============================================================
# 导出格式（publish 阶段使用）
# ============================================================
exports:
  - format: wechat_md
    platform: wechat
    description: "Markdown Nice 适配格式"
    output: "content/articles/{slug}/export/08-wechat-publish.md"
  - format: xiaohongshu_md
    platform: xiaohongshu
    description: "小红书短图文正文（≤500 字 + 话题标签）"
    output: "content/articles/{slug}/export/08-xiaohongshu-publish.md"
    word_limit: 500
  - format: zhihu_md
    platform: zhihu
    description: "知乎回答/文章（辩证结构 + 完整代码）"
    output: "content/articles/{slug}/export/08-zhihu-publish.md"
  - format: juejin_md
    platform: juejin
    description: "掘金技术实战（代码优先 + 版本说明）"
    output: "content/articles/{slug}/export/08-juejin-publish.md"
  - format: teaser
    platform: wechat
    description: "短摘要版（朋友圈/社群分发；仅 wechat 产出）"
    output: "content/articles/{slug}/export/08-teaser-120chars.md"
    word_limit: 120

# ============================================================
# Skill 注册表
# ============================================================
registry:
  skills_paths: [.claude/skills]
  rules_paths:  [.claude/rules]

# ============================================================
# 路径常量（全局使用 · 单一事实来源）
# ============================================================
paths:
  articles_root: content/articles
  profiles_root: profiles                           # Profile pack 根目录
  profile_resolved_dir: runtime/profile-resolved    # 合成产物目录（agent 读的唯一真源）
  profile_lock: runtime/profile-lock.yaml           # 当前工作区绑定的 Profile
  references_dir: content/references
  retrospectives_dir: content/retrospectives
  state_dir: runtime/pipeline-states
  writing_kernel: framework/contracts/writing-kernel.md    # 平台无关写作元契约
  profile_protocol: framework/contracts/profile-protocol.md
  artifact_layout: framework/config/artifact-layout.yaml

# ============================================================
# 排版适配器配置（非 pipeline 阶段 · adapter-only）
#
# 注意：本段**不是** pipeline 的某个 stage；pipeline 终点为 publish。
# 下列字段只描述"Ink-Flow 与下游独立 repo wechat-typeset 对账所需的元数据"。
#
# 架构：
#   wechat-typeset 是独立 repo（https://github.com/lync-cyber/wechat-typeset），
#   纯浏览器工具。Ink-Flow 通过 framework/tools/_adapters/ 读对方
#   `dist/api/capabilities.json` 做"能力对账 + variant 白名单"，不做主题决策。
#
#   writer 按当前绑定 Profile 的 typesetting.containers.whitelist 直接写 ::: 容器，
#   publisher 直接交付 08-wechat-publish.md，
#   主题 / variant / 组件切换由用户在本地编辑器里运行时完成。
# ============================================================
typeset_adapter:
  adapter: wechat-typeset               # 可选值 / 扩展点见 framework/tools/_adapters/
  contract: framework/contracts/wechat-typeset.schema.json   # 版本承载在 schemaVersion 字段而非文件名
  required_version: ">=0.2.0,<0.3.0"    # adapter 在 capabilities 拉取时对账
  # dist_dir 解析优先级：
  #   1. WECHAT_TYPESET_DIR 环境变量
  #   2. 本字段（若填写）
  #   3. 约定 ../wechat-typeset/dist（Ink-Flow 的同级目录）
  dist_dir: null
  # 本地工具启动信息（publisher 完成后提示用户）
  launcher:
    repo: https://github.com/lync-cyber/wechat-typeset
    local_default_url: http://127.0.0.1:7788/
