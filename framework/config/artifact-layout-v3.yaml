# ============================================================
# 文章产物布局 v3（按"阶段即目录"组织 · 向前兼容）
#
# 设计动机（对比 v2）：
#   - v2 用数字前缀命名文件（01-brief.md … 08-wechat-publish.md）。新增阶段
#     或新增平台（知乎/小红书/Medium）时前缀重排 → 历史文章无法自动对齐。
#   - v3 把**阶段 = 目录**，把**平台隔离到 typeset/{platform}/** 之下，
#     插入新阶段或新平台时目录稳定，不破坏已有产物。
#
# 兼容策略：
#   - 旧文章保留 v2 布局不动；orchestrator 通过 `_manifest.yaml` 的
#     `layout_version` 字段判断布局版本，按不同路径模板读写。
#   - 新文章走 v3；用 `framework/tools/migrate-layout.sh` 手动迁移旧文章。
#
# 单一事实来源：所有 agent/skill 通过 artifact_layout 字段拿路径。
# ============================================================

version: "3.0"
root: "content/articles/{slug}"

# 每篇文章的"索引 + 阶段状态快照"
manifest: "content/articles/{slug}/_manifest.yaml"

paths:
  # ---- 01 brief ----
  brief:              "content/articles/{slug}/01-brief/brief.md"

  # ---- 02 research ----
  research:           "content/articles/{slug}/02-research/memo.md"
  research_sources:   "content/articles/{slug}/02-research/sources.yaml"

  # ---- 03 outline ----
  outline:            "content/articles/{slug}/03-outline/outline.md"

  # ---- 04 draft + figures（并行） ----
  draft_section:      "content/articles/{slug}/04-draft/section-{N}.md"
  draft_merged:       "content/articles/{slug}/04-draft/merged.md"
  figure_item:        "content/articles/{slug}/04-figures/fig-{N}.{ext}"
  figure_index:       "content/articles/{slug}/04-figures/index.md"

  # ---- 05 audit ----
  audit:              "content/articles/{slug}/05-audit/report.md"

  # ---- 06 polish ----
  polish_trace:       "content/articles/{slug}/06-polish/trace.md"
  final:              "content/articles/{slug}/06-polish/final.md"

  # ---- 07 publish（平台无关的 Markdown 产物） ----
  wechat:             "content/articles/{slug}/07-publish/wechat.md"
  plain:              "content/articles/{slug}/07-publish/plain.md"
  teaser:             "content/articles/{slug}/07-publish/teaser.md"

  # ---- 08 typeset（平台相关的排版产物） ----
  # 每个平台一个子目录；新增 zhihu / xiaohongshu / medium 只扩展 {platform}
  typeset_plan:       "content/articles/{slug}/08-typeset/{platform}/plan.md"
  typeset_annotated:  "content/articles/{slug}/08-typeset/{platform}/annotated.md"
  typeset_render:     "content/articles/{slug}/08-typeset/{platform}/render.html"
  typeset_meta:       "content/articles/{slug}/08-typeset/{platform}/meta.json"

# ---- 运行状态（全局） ----
state_file:       "runtime/pipeline-states/{slug}.json"
caps_cache:       "runtime/typeset-capabilities.json"
trace_dir:        "runtime/traces/{slug}"
trace_file:       "runtime/traces/{slug}/{stage}-{run_id}.json"

# ---- 命名规范 ----
naming:
  section_number_padding: 2
  figure_number_padding: 2
  slug_style: kebab_or_pinyin
  platform_whitelist: [wechat, zhihu, xiaohongshu, medium]

# ---- Manifest Schema（每篇文章根目录的 _manifest.yaml） ----
manifest_schema:
  type: object
  required: [slug, layout_version, created_at, pipeline]
  properties:
    slug: {type: string}
    column: {type: string}
    layout_version: {type: string, const: "3.0"}
    created_at: {type: string, format: date-time}
    pipeline:
      type: array
      items:
        type: object
        required: [stage, status]
        properties:
          stage: {type: string, enum: [brief, research, outline, draft, figures, audit, polish, publish, typeset]}
          status: {type: string, enum: [pending, in_progress, completed, skipped, failed]}
          artifact: {type: string}
          additional_artifacts: {type: array, items: {type: string}}
          checksum: {type: string}
          completed_at: {type: string}
          reason: {type: string}
          platform: {type: string, description: "仅 typeset 阶段使用"}
          adapter_version: {type: string, description: "仅 typeset 阶段使用"}
