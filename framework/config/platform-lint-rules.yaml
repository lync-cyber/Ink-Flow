# ============================================================
# 平台 lint 规则策略（消费者：lint.py --platform）
#
# 职责边界：
# - 本文件只放"规则的开/关 / 严重级别 / 消息文案 / 关键词列表 / 平台特化模式"
# - 数值阈值（max_paragraph_chars / max_sentence_chars / allowed_headings /
#   length_limit_factor / length_hard_factor / svg / forbidden_css / forbidden_tags）
#   由 runtime/profile-resolved/typesetting.yaml + constraints.yaml 提供（Profile 合成产物）
# - lint.py 先从 Profile resolved 读数值，再读本文件做 enabled/severity 覆盖
#
# 加载策略：按 --platform 参数只加载当前平台段
# enforce 级别：error 阻断；warning 记录不阻断
# ============================================================

version: "3.0"

# 所有平台共享的基础（强制启用）
base:
  forbidden_blocks:
    enabled: true
    severity: error          # ::: 容器默认禁；wechat 平台段显式关闭并改走 container_whitelist
  forbidden_patterns:
    enabled: true
    severity: warning        # AI 味词库，平台无关
  image_references:
    enabled: true
    severity: warning
  heading_skip_level:
    enabled: true
    severity: warning        # H2→H4 跳级警告；四平台共用

# ============================================================
# 平台差异段：覆盖/关闭/追加
# key = brief.target_platforms 元素
# 数值阈值参见 runtime/profile-resolved/typesetting.yaml 同 key
# ============================================================

platforms:

  wechat:
    # 最严：GFM Alerts + 段落字数 + CSS 安全 + SVG 可读性全开
    # 注：wechat 允许 ::: 容器（Profile typesetting.containers.whitelist 声明），由 container_whitelist 校验 id 合法性
    forbidden_blocks:
      enabled: false               # wechat 允许 ::: 容器；由 container_whitelist 校验
    container_whitelist:
      enabled: true
      severity: error
      whitelist_source: runtime/profile-resolved/typesetting.yaml
      capabilities_cache: runtime/typeset-capabilities.json    # variant id 以此为准，缺失时降级到 whitelist_source
    typography:
      enabled: true
      severity: warning
    gfm_alerts:
      enabled: true
      severity: warning
      # 权威来源：framework/contracts/writing-kernel.md § 1 + platform-wechat Profile typesetting.alerts.allowed
      allowed_types: [NOTE, TIP, IMPORTANT, WARNING, CAUTION]
    css_safety:
      enabled: true
      severity: error
    svg_readability:
      enabled: true
      severity: error
    theme_constraints:
      enabled: true
      severity: error
    forbidden_code_blocks:
      enabled: false         # wechat 允许代码块

  xiaohongshu:
    # 短图文：禁代码块 / 段落短 / 不要 GFM Alerts（不原生支持）/ 不强调 CSS
    typography:
      enabled: true
      severity: error              # 小红书段落硬约束
    gfm_alerts:
      enabled: false               # 小红书不渲染 GFM Alert，lint 跳过
    css_safety:
      enabled: false               # 纯文本投递，无 CSS 上下文
    svg_readability:
      enabled: false               # 无 SVG
    theme_constraints:
      enabled: false
    forbidden_code_blocks:
      enabled: true
      severity: error              # 小红书不支持代码块
      message: "小红书不支持代码块，请改为截图占位 [图 N：贴截图]"
    required_hashtags:
      enabled: true
      severity: warning
      min_count: 3
      max_count: 5
      pattern: "^#[^\\s]+$"

  zhihu:
    # 长文深度：宽松段落 / Alert 降级 / 允许 inline 公式 / 要求辩证
    typography:
      enabled: true
      severity: warning
    gfm_alerts:
      enabled: true
      severity: warning
      degrade_to_blockquote: true  # 知乎渲染 Alert 会降级成引用，lint 提醒但不报错
    css_safety:
      enabled: false               # 知乎投递用纯 Markdown，无 CSS
    svg_readability:
      enabled: false
    theme_constraints:
      enabled: true
      severity: warning
    forbidden_code_blocks:
      enabled: false
    require_counter_argument:
      enabled: true
      severity: warning
      message: "知乎文章建议至少包含 1 个反方观点（voice 规则要求）"
      detect_keywords: ["反过来", "但也有人", "反对意见", "另一种看法"]

  juejin:
    # 技术实战：代码块必标语言 / 允许 inline code / frontmatter description 必填 / 宽松段落
    typography:
      enabled: true
      severity: warning
    gfm_alerts:
      enabled: true
      severity: warning
      # 权威来源：framework/contracts/writing-kernel.md § 1
      allowed_types: [NOTE, TIP, IMPORTANT, WARNING, CAUTION]
    css_safety:
      enabled: false               # 掘金投递 Markdown，无 CSS
    svg_readability:
      enabled: false
    theme_constraints:
      enabled: false
    code_block_must_lang:
      enabled: true
      severity: error              # 掘金代码块必须标语言
      message: "掘金代码块必须标注语言（```python / ```ts 等）"
    require_frontmatter_fields:
      enabled: true
      severity: error
      fields: [title, description, tags]
      message: "掘金 frontmatter 必须包含 title/description/tags"
    require_github_link:
      enabled: true
      severity: warning
      message: "掘金技术文建议文末附 GitHub/文档链接"
