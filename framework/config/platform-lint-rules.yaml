# ============================================================
# 平台 lint 规则数据（消费者：lint.py --platform）
#
# 设计原则：
# - 本文件只放"平台差异规则"。跨平台共用规则在 lint.py DEFAULT_CONFIG + .claude/rules/data/*.yaml
# - 渐进披露：lint.py 按 --platform 参数只加载当前平台段，不一次性读全
# - enforce 级别：error 阻断；warning 记录不阻断
# ============================================================

version: "1.0"

# 所有平台共享的基础（强制启用）
base:
  forbidden_blocks:
    enabled: true
    severity: error          # ::: 容器一律禁（所有平台 publisher 阶段产物）
  forbidden_patterns:
    enabled: true
    severity: warning        # AI 味词库，平台无关
  image_references:
    enabled: true
    severity: warning

# ============================================================
# 平台差异段：覆盖/关闭/追加
# key = brief.target_platforms 元素
# ============================================================

platforms:

  wechat:
    # 最严：GFM Alerts + 段落字数 + CSS 安全 + SVG 可读性全开
    typography:
      enabled: true
      severity: warning
      max_paragraph_chars: 120
      max_sentence_chars: 40
      allowed_headings: [2, 3, 4]
    gfm_alerts:
      enabled: true
      severity: warning
      allowed_types: [NOTE, TIP, IMPORTANT, WARNING, CAUTION]
    css_safety:
      enabled: true
      severity: error
      forbidden_css: ["position:", "@media", "@keyframes", ":hover", ":active", "float:", "gap:"]
      forbidden_tags: ["<style", "<script", "<iframe", "<form"]
    svg_readability:
      enabled: true
      severity: error
    theme_constraints:
      enabled: true
      severity: error
    forbidden_code_blocks:
      enabled: false         # wechat 允许代码块
    length_limit_factor: 1.05    # 超 length_limit × 此系数判 warning，× 1.10 判 error

  xiaohongshu:
    # 短图文：禁代码块 / 段落短 / 不要 GFM Alerts（不原生支持）/ 不强调 CSS
    typography:
      enabled: true
      severity: error              # 小红书段落硬约束
      max_paragraph_chars: 30
      max_sentence_chars: 30
      allowed_headings: [2, 3]     # 小红书渲染仅到 H3
    gfm_alerts:
      enabled: false               # 小红书不渲染 GFM Alert，lint 跳过
    css_safety:
      enabled: false               # 纯文本投递，无 CSS 上下文
    svg_readability:
      enabled: false               # 无 SVG
    theme_constraints:
      enabled: false
    forbidden_code_blocks:
      enabled: true
      severity: error              # 小红书不支持代码块
      message: "小红书不支持代码块，请改为截图占位 [图 N：贴截图]"
    required_hashtags:
      enabled: true
      severity: warning
      min_count: 3
      max_count: 5
      pattern: "^#[^\\s]+$"
    length_limit_factor: 1.05

  zhihu:
    # 长文深度：宽松段落 / Alert 降级 / 允许 inline 公式 / 要求辩证
    typography:
      enabled: true
      severity: warning
      max_paragraph_chars: 500     # 知乎段落可以很长
      max_sentence_chars: 50
      allowed_headings: [2, 3, 4]
    gfm_alerts:
      enabled: true
      severity: warning
      degrade_to_blockquote: true  # 知乎渲染 Alert 会降级成引用，lint 提醒但不报错
    css_safety:
      enabled: false               # 知乎投递用纯 Markdown，无 CSS
    svg_readability:
      enabled: false
    theme_constraints:
      enabled: true
      severity: warning
    forbidden_code_blocks:
      enabled: false
    require_counter_argument:
      enabled: true
      severity: warning
      message: "知乎文章建议至少包含 1 个反方观点（tone.rules 要求）"
      detect_keywords: ["反过来", "但也有人", "反对意见", "另一种看法"]
    length_limit_factor: 1.05

  juejin:
    # 技术实战：代码块必标语言 / 允许 inline code / frontmatter description 必填 / 宽松段落
    typography:
      enabled: true
      severity: warning
      max_paragraph_chars: 300
      max_sentence_chars: 45
      allowed_headings: [2, 3, 4]
    gfm_alerts:
      enabled: true
      severity: warning
      allowed_types: [NOTE, TIP, IMPORTANT, WARNING, CAUTION]
    css_safety:
      enabled: false               # 掘金投递 Markdown，无 CSS
    svg_readability:
      enabled: false
    theme_constraints:
      enabled: false
    code_block_must_lang:
      enabled: true
      severity: error              # 掘金代码块必须标语言
      message: "掘金代码块必须标注语言（```python / ```ts 等）"
    require_frontmatter_fields:
      enabled: true
      severity: error
      fields: [title, description, tags]
      message: "掘金 frontmatter 必须包含 title/description/tags"
    require_github_link:
      enabled: true
      severity: warning
      message: "掘金技术文建议文末附 GitHub/文档链接"
    length_limit_factor: 1.05
