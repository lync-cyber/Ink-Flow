# ============================================================
# juejin 平台 publish 转换序列
# ============================================================

platform: juejin

keep_frontmatter: true

transforms:
  - kind: require_frontmatter_field
    field: description
    fallback_from: "brief.tldr"
    severity: error
    note: "掘金 frontmatter 必填 description；缺失则取 brief.tldr 自动补；仍缺则报错"

  - kind: adapt_frontmatter_tags_format
    from: "tags: [a, b]"
    to: "tag: [a, b]"
    note: "掘金 frontmatter 字段名是 tag（非 tags）"

  - kind: enforce_code_block_lang
    severity: error
    note: "代码块必须标注语言（```python / ```ts 等），缺失则报错"

  - kind: append_external_links_block
    sections:
      - "## 延伸阅读"
    require_github_link: true
    note: "文末追加 GitHub/文档链接区块"

extra_outputs: []

hands_off_to_typeset: false
