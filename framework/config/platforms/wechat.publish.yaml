# ============================================================
# wechat 平台 publish 转换序列（消费者：publisher agent）
#
# 设计原则：
# - publisher 不再在 prompt 里写 if/elif；按 transforms 列表顺序应用
# - kind 是约定的"原子操作"；note 是 LLM 可直接理解的人话
# - 新平台只需新增 framework/config/platforms/{p}.publish.yaml
# ============================================================

platform: wechat

# 是否保留 polish 终稿的 frontmatter
keep_frontmatter: true

# transform 序列（按顺序执行）
transforms:
  - kind: title_to_h1
    note: "frontmatter.title → 文档第一行 # {title}"

  - kind: prepend_tldr_blockquote
    when: "column != 'story'"
    note: "H1 之后插入 > {tldr}（取自 brief frontmatter）"

  - kind: forbid_block_syntax
    pattern: "^:::"
    severity: error
    note: "::: 容器只在 typeset 阶段引入；publisher 阶段任何残留都是上游 bug，必须回滚 polish"

  - kind: heading_level_for_references
    level: 3
    note: "参考文献区块用 H3"

  - kind: append_ops_block
    sections:
      - "### 阅读原文"
      - "### 关于作者"
    note: "文末追加运营区"

# 微信特有的额外产物（其他平台无此字段）
extra_outputs:
  - format: teaser
    output: "content/articles/{slug}/export/08-teaser-120chars.md"
    word_limit: 120
    note: "120 字摘要 + 关键词 + 封面变量，供社群分发"
  - format: plain
    output: "content/articles/{slug}/export/08-plain-publish.md"
    note: "剥运营区的平台无关兜底版"

# 与 typeset 阶段的交接点
hands_off_to_typeset: true
typeset_input: "content/articles/{slug}/export/08-wechat-publish.md"
