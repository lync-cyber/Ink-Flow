<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>InkFlow 排版工具</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f7f5f1;
      --card: #ffffff;
      --line: #e4ddd2;
      --text: #2a2623;
      --muted: #8a8078;
      --accent: #b5311c;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      max-width: 820px;
      margin: 40px auto;
      padding: 24px;
      color: var(--text);
      background: var(--bg);
      line-height: 1.65;
    }
    h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: 0.5px; }
    .hint { color: var(--muted); font-size: 13px; margin: 0 0 32px; }
    .group { margin-bottom: 32px; }
    .group > h2 {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0 0 12px;
      font-weight: 500;
    }
    .columns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .columns button {
      padding: 7px 16px;
      border: 1px solid #d0c8bd;
      background: #fff;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      transition: all .15s;
      font-family: inherit;
    }
    .columns button:hover { border-color: var(--accent); color: var(--accent); }
    .columns button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .articles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .card {
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
      transition: all .15s;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(181, 49, 28, 0.06);
    }
    .card .title { font-weight: 600; font-size: 14px; margin-bottom: 4px; word-break: break-all; }
    .card .meta { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 16px 0;
      font-style: italic;
    }
    .footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
      line-height: 1.8;
    }
    .footer code {
      background: #ede7dd;
      padding: 1px 5px;
      border-radius: 3px;
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 11.5px;
    }
    .error {
      padding: 20px 24px;
      background: #fdf5e8;
      border: 1px solid #e8c078;
      border-radius: 6px;
      color: #5a3a0a;
      font-size: 13.5px;
      line-height: 1.9;
      white-space: pre-wrap;
    }
    .error strong {
      font-family: ui-monospace, "Cascadia Code", monospace;
      background: #fff;
      padding: 1px 6px;
      border-radius: 3px;
      border: 1px solid #e8c078;
      font-weight: 500;
    }
    .error code {
      font-family: ui-monospace, "Cascadia Code", monospace;
      background: #fff;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 12.5px;
    }
  </style>
</head>
<body>
  <h1>InkFlow 排版工具</h1>
  <p class="hint">选栏目主题 + 选文章 → 在 doocs/md 预览与编辑 → 一键复制到公众号</p>

  <div class="group">
    <h2>栏目主题</h2>
    <div class="columns" id="columns"></div>
  </div>

  <div class="group">
    <h2>文章</h2>
    <div class="articles" id="articles"></div>
  </div>

  <div class="footer">
    构建产物：<code>framework/tools/typeset/dist/doocs/</code><br>
    关闭服务：终端窗口 <code>Ctrl+C</code> 或直接关窗<br>
    如果预览栏目为空：<code>runtime/column-design/*/theme.css</code> 未找到；文章为空：<code>content/articles/*/export/08-wechat-publish.md</code> 未找到
  </div>

  <script>
    let currentColumn = null;

    function el(tag, attrs, children) {
      const e = document.createElement(tag);
      if (attrs) for (const k in attrs) {
        if (k === 'class') e.className = attrs[k];
        else if (k === 'dataset') for (const dk in attrs[k]) e.dataset[dk] = attrs[k][dk];
        else e.setAttribute(k, attrs[k]);
      }
      if (children) for (const c of children) {
        e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      }
      return e;
    }

    function showStandaloneHint() {
      document.body.innerHTML =
        '<h1>InkFlow 排版工具</h1>' +
        '<div class="error">' +
        '⚠ 这个页面需要通过本地服务打开。\n\n' +
        '请双击：\n' +
        '  • Windows：<strong>framework/tools/typeset.bat</strong>\n' +
        '  • macOS/Linux：<strong>framework/tools/typeset.command</strong>\n\n' +
        '首次使用会自动跑 <code>node framework/tools/typeset/setup.mjs</code>（clone + build，约 3-5 分钟）。\n\n' +
        '直接以 file:// 打开无法使用，因为「复制到公众号」要求 secure context（仅 https / 127.0.0.1 / localhost 成立）。' +
        '</div>';
    }

    async function load() {
      if (location.protocol !== 'http:' && location.protocol !== 'https:') {
        showStandaloneHint();
        return;
      }
      const [themes, articles] = await Promise.all([
        fetch('/api/themes').then(r => r.json()),
        fetch('/api/articles').then(r => r.json()),
      ]);
      renderColumns(themes);
      renderArticles(articles);
    }

    function renderColumns(themes) {
      const container = document.getElementById('columns');
      const keys = Object.keys(themes);
      container.innerHTML = '';
      if (keys.length === 0) {
        container.appendChild(el('span', { class: 'empty' }, ['未找到栏目主题']));
        return;
      }
      currentColumn = keys[0];
      for (const k of keys) {
        const btn = el('button', { dataset: { col: k } }, [k]);
        if (k === currentColumn) btn.classList.add('active');
        btn.onclick = () => {
          currentColumn = k;
          container.querySelectorAll('button').forEach((b) => {
            b.classList.toggle('active', b.dataset.col === k);
          });
        };
        container.appendChild(btn);
      }
    }

    function renderArticles(articles) {
      const container = document.getElementById('articles');
      const keys = Object.keys(articles);
      container.innerHTML = '';
      if (keys.length === 0) {
        container.appendChild(el('span', { class: 'empty' }, ['未找到文章']));
        return;
      }
      for (const slug of keys) {
        const preview = (articles[slug].preview || '').trim() || '（空文档）';
        const card = el('div', { class: 'card', dataset: { slug } }, [
          el('div', { class: 'title' }, [slug]),
          el('div', { class: 'meta' }, [preview.slice(0, 60) + (preview.length > 60 ? '…' : '')]),
        ]);
        card.onclick = () => {
          const q = new URLSearchParams();
          if (currentColumn) q.set('column', currentColumn);
          q.set('article', slug);
          location.href = '/doocs/index.html?' + q.toString();
        };
        container.appendChild(card);
      }
    }

    load().catch((e) => {
      document.body.innerHTML = '<div class="error">加载失败：\n' + e + '</div>';
    });
  </script>
</body>
</html>
