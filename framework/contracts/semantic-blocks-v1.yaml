# ============================================================
# Semantic-Blocks Contract v1
#
# 作用：在 writer / publisher / typesetter 三方之间建立"语义块 ↔ wechat-typeset
# 容器"的机读映射表（SSOT）。
#
# 消费者：
#   - publisher.md            按 detector 自动注入 <!-- semantic: {id} --> 锚点
#   - lint.py                 检查 GFM Alert 类型是否在 allowed_alert_types 内
#                             检查 steps/compare 等必须升格的结构是否带 hint
#   - typesetter.md / steps.md 按 marker → container/fence/kind 硬映射升格
#   - cli.py semantic-map     静态校验：所有 container 必须在 capabilities 内
#
# 维护约束：
#   - 本文件只放"语义块→容器的映射 + publisher 注入规则"；容器变体 / persona 的
#     权威在 sibling repo 的 capabilities.json，不在此处。
#   - 新增映射必须跑 `python framework/tools/_adapters/cli.py semantic-map --validate`
#     通过才能合入（container id 必须已在 capabilities.containers[*].id）。
# ============================================================

version: "1.0"
contract_ref: "wechat-typeset-v2.schema.json"
capabilities_ref: "runtime/typeset-capabilities.json"

# ------------------------------------------------------------
# GFM Alert → 容器（确定性硬映射，typesetter 不再临场决策）
# writer 可以放心使用 5 种 Alert；typesetter 按此表升格。
# ------------------------------------------------------------
gfm_alert_map:
  NOTE:
    container: note
    kind: free
    notes: "free kind 不接 variant；按 persona 默认样式渲染"
  TIP:
    container: tip
    kind: admonition
    notes: "admonition；默认走 persona.variants.admonition，typesetter 可在 plan 里用 variant= 覆盖"
  IMPORTANT:
    container: info
    kind: admonition
    notes: "wechat-typeset 契约无 important 容器；info 在所有 persona admonition 家族里都受支持，语义最近"
  WARNING:
    container: warning
    kind: admonition
  CAUTION:
    container: danger
    kind: admonition
    notes: "红线 / 不可逆；比 warning 高一级"

# writer 可生成的 GFM Alert 类型（供 lint rule_gfm_alerts 消费）
allowed_alert_types: [NOTE, TIP, IMPORTANT, WARNING, CAUTION]

# ------------------------------------------------------------
# 需要 publisher 注入 <!-- semantic: {id} --> 锚点的结构块
# typesetter 见到锚点才升格；没锚点不升格（而非"猜"）。
# ------------------------------------------------------------
structured_blocks:

  - id: quote-card
    container: quote-card
    fence: ":::"
    kind: variantized
    detector:
      kind: blockquote
      rule: "独立成段、非 GFM Alert（无 [!TYPE]）、段中至少一句完整论断"
    hint: "<!-- semantic: quote-card -->"
    publisher_mode: manual   # 默认不自动（避免把作者旁白都升格）；publisher 对候选句 AskUser
    rationale: "金句卡是作者判断结果，不应由正则替 publisher 拍板"

  - id: steps
    container: steps
    fence: ":::"
    kind: variantized
    detector:
      kind: marked-ordered-list
      rule: '连续 ≥2 个段落首部匹配 "\*\*第 \d+ 步\*\*"'
    hint: "<!-- semantic: steps -->"
    publisher_mode: auto
    rationale: '"第 N 步" 是强格式信号，误伤率极低'

  - id: compare
    container: compare
    fence: "::::"            # 外层四冒号（contract v2 明确要求）
    kind: variantized
    detector:
      kind: gfm-table
      rule: "header 首列为维度词；其余列为被比较对象（2-4 列）；或 header 含'对比|vs|比较|差异|方案'字样"
    hint: "<!-- semantic: compare -->"
    publisher_mode: auto
    fallback: "未命中 header 关键词时，publisher 对该表 AskUser 是否升格"
    rationale: "wechat-typeset 的 compare 要 :::: 外 + ::: pros/cons 嵌套；普通表格不是 compare"

  - id: see-also
    container: see-also
    fence: ":::"
    kind: free
    detector:
      kind: heading-tail-section
      rule: "H3 标题为'延伸阅读'/'相关链接'/'参考资源'，且其下为无序列表"
    hint: "<!-- semantic: see-also -->"
    publisher_mode: auto

# ------------------------------------------------------------
# Writer 负向清单（由 writer.md 引用 + lint 校验）
# ------------------------------------------------------------
writer_forbids:
  - rule: "direct-container-syntax"
    detail: "writer 产物禁止出现任何 ::: / :::: 开头的容器行（typesetter 唯一职权）"
    lint_rule: "A1 (forbidden_blocks)"

  - rule: "camelcase-container-name"
    detail: "禁止写 quoteCard / keyNumber / sectionTitle / seeAlso / footerCTA 等驼峰容器名；contract v2 容器 id 一律 kebab-case"
    lint_rule: "A5 (annotated_hygiene)"

  - rule: "ad-hoc-semantic-hint"
    detail: "writer 不得手写 <!-- semantic: ... -->；此 hint 由 publisher 在导出阶段按 detector 自动注入"
    lint_rule: "H1 (semantic_hint_origin)"

  - rule: "handwritten-admonition-downgrade"
    detail: "禁止用 > [!IMPORTANT] 后紧跟 <!-- variant=... --> 等 HTML 注释尝试指定 variant；variant 只能写在 typesetter annotated.md 的 open 行"
    lint_rule: "A3 (annotated_hygiene)"

# ------------------------------------------------------------
# Polisher 保护清单（polisher 不得在润色时删除/改写下列结构）
# 保护的是"typesetter 升格所需的锚点特征"，不是具体字词。
# ------------------------------------------------------------
polisher_protects:
  - pattern: '^\*\*第 \d+ 步\*\*'
    reason: "steps 升格锚点；改写为'首先/其次/最后'会让 typesetter 失去标记"
  - pattern: '^> \[![A-Z]+\]$'
    reason: "GFM Alert 首行；任何改写会破坏 gfm_alert_map 的硬映射"
  - pattern: '<!-- semantic: [a-z-]+ -->'
    reason: "publisher 已注入的 semantic hint；polisher 阶段不该看到，若看到说明阶段错乱"
  - pattern: '^\|.*\|$'
    reason: "GFM 表格行；不要拆成多段或改成无序列表"

# ------------------------------------------------------------
# Typesetter 升格规则（steps.md 按此表执行，不再"临场决策"）
#
# 核心原则：
#   - 命中 gfm_alert_map → 按表升格，variant 走 persona 默认或 plan 里的 override
#   - 命中 structured_blocks.hint → 按表升格
#   - 未命中 hint 的 blockquote / 表格 / 有序列表 → 保持原样，不升格
#   - 命中 gfm_alert_map 但类型不在此表 → 硬失败（agent 置 meta.json.errors，CP3=failed）
# ------------------------------------------------------------
typesetter_promotion:
  strict: true
  on_unmapped_alert: "fail"          # 见到未映射的 [!XXX] 类型 → 报错回灌上游
  on_unhinted_structure: "passthrough"  # 没 hint 的结构保持 GFM 原样
  on_camelcase_leak: "fail"          # publish.md 里出现 ::: quoteCard 直接失败
  on_silent_rewrite: "forbid"        # 禁止把 [!IMPORTANT]→tip+terminal 这种临场决策；只能走 gfm_alert_map
