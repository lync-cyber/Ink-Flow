<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"></head>
<body style="margin:0;">
<div style="width:640px;padding:28px 24px 24px;background:#fefefe;font-family:'Microsoft YaHei','PingFang SC',sans-serif;box-sizing:border-box;">

  <!-- 标题 -->
  <div style="font-size:16px;font-weight:700;color:#1a1a2e;margin-bottom:16px;letter-spacing:0.5px;">
    公众号排版工具对比
  </div>

  <table style="width:100%;border-collapse:collapse;font-size:14px;">
    <thead>
      <tr style="background:#1a1a2e;color:#fefefe;">
        <th style="padding:12px 16px;text-align:left;font-weight:600;border-radius:8px 0 0 0;width:28%;">工具</th>
        <th style="padding:12px 16px;text-align:left;font-weight:600;width:24%;">定位</th>
        <th style="padding:12px 16px;text-align:left;font-weight:600;width:20%;">收费</th>
        <th style="padding:12px 16px;text-align:left;font-weight:600;border-radius:0 8px 0 0;width:28%;">AI 能力</th>
      </tr>
    </thead>
    <tbody>
      <!-- Markdown Nice -->
      <tr style="background:#f9f9f9;">
        <td style="padding:11px 16px;border-bottom:1px solid #e8e8e8;color:#2d2d2d;font-weight:600;">Markdown Nice</td>
        <td style="padding:11px 16px;border-bottom:1px solid #e8e8e8;color:#555;">在线编辑器</td>
        <td style="padding:11px 16px;border-bottom:1px solid #e8e8e8;color:#555;">免费</td>
        <td style="padding:11px 16px;border-bottom:1px solid #e8e8e8;color:#999;">无</td>
      </tr>
      <!-- doocs/md -->
      <tr style="background:#fefefe;">
        <td style="padding:11px 16px;border-bottom:1px solid #e8e8e8;color:#2d2d2d;font-weight:600;">doocs/md</td>
        <td style="padding:11px 16px;border-bottom:1px solid #e8e8e8;color:#555;">功能最全编辑器</td>
        <td style="padding:11px 16px;border-bottom:1px solid #e8e8e8;color:#555;">免费</td>
        <td style="padding:11px 16px;border-bottom:1px solid #e8e8e8;color:#999;">无</td>
      </tr>
      <!-- 壹伴 -->
      <tr style="background:#f9f9f9;">
        <td style="padding:11px 16px;border-bottom:1px solid #e8e8e8;color:#2d2d2d;font-weight:600;">壹伴</td>
        <td style="padding:11px 16px;border-bottom:1px solid #e8e8e8;color:#555;">非技术用户友好</td>
        <td style="padding:11px 16px;border-bottom:1px solid #e8e8e8;color:#e07b39;">付费订阅</td>
        <td style="padding:11px 16px;border-bottom:1px solid #e8e8e8;color:#555;">AI 生成文字</td>
      </tr>
      <!-- wechat-typeset 高亮行 -->
      <tr style="background:#edf4ff;outline:2px solid #4f9cf9;outline-offset:-1px;">
        <td style="padding:11px 16px;border-bottom:none;border-radius:0 0 0 8px;">
          <span style="color:#1a6ed4;font-weight:700;">wechat-typeset</span>
          <span style="display:inline-block;margin-left:6px;background:#4f9cf9;color:#fefefe;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;">推荐</span>
        </td>
        <td style="padding:11px 16px;border-bottom:none;color:#1a1a2e;font-weight:600;">本地开源工具</td>
        <td style="padding:11px 16px;border-bottom:none;color:#2a7a2a;font-weight:600;">免费开源</td>
        <td style="padding:11px 16px;border-bottom:none;border-radius:0 0 8px 0;color:#1a6ed4;font-weight:600;">AI 生成专属主题</td>
      </tr>
    </tbody>
  </table>

  <!-- 注脚 -->
  <div style="margin-top:12px;font-size:12px;color:#999;line-height:1.6;">
    * wechat-typeset 需本地执行两行启动命令；其余工具直接在浏览器使用。
  </div>
</div>
</body>
</html>
