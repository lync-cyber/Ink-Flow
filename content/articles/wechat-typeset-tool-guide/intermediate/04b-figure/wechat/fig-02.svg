<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .card { fill: #fefefe; rx: 12; }
      .step-circle { fill: #4f9cf9; }
      .step-num { font-family: "Microsoft YaHei","PingFang SC",sans-serif; font-size: 20px; font-weight: 700; fill: #fefefe; text-anchor: middle; dominant-baseline: central; }
      .step-title { font-family: "Microsoft YaHei","PingFang SC",sans-serif; font-size: 18px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
      .step-desc { font-family: "Microsoft YaHei","PingFang SC",sans-serif; font-size: 14px; font-weight: 400; fill: #666; text-anchor: middle; }
      .arrow { stroke: #4f9cf9; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .title-text { font-family: "Microsoft YaHei","PingFang SC",sans-serif; font-size: 16px; font-weight: 400; fill: #888; text-anchor: middle; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#4f9cf9"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect class="bg" width="640" height="300"/>

  <!-- 顶部说明 -->
  <text class="title-text" x="320" y="34">AI 生成专属主题，全程三步搞定</text>

  <!-- 卡片 1 -->
  <rect x="40" y="60" width="160" height="180" rx="12" fill="#fefefe" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.08))"/>
  <circle cx="120" cy="106" r="24" class="step-circle"/>
  <text class="step-num" x="120" y="106">1</text>
  <!-- 图标：对话气泡用简单矩形模拟 -->
  <text font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="28" text-anchor="middle" x="120" y="158" fill="#4f9cf9">💬</text>
  <text class="step-title" x="120" y="195">描述风格</text>
  <text class="step-desc" x="120" y="218">"科技感、深色、</text>
  <text class="step-desc" x="120" y="236">终端风"</text>

  <!-- 箭头 1→2 -->
  <line x1="205" y1="150" x2="232" y2="150" class="arrow" marker-end="url(#arr)"/>

  <!-- 卡片 2 -->
  <rect x="240" y="60" width="160" height="180" rx="12" fill="#fefefe" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.08))"/>
  <circle cx="320" cy="106" r="24" class="step-circle"/>
  <text class="step-num" x="320" y="106">2</text>
  <text font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="28" text-anchor="middle" x="320" y="158" fill="#4f9cf9">✨</text>
  <text class="step-title" x="320" y="195">AI 生成</text>
  <text class="step-desc" x="320" y="218">自动生成主题，</text>
  <text class="step-desc" x="320" y="236">自动校验规范</text>

  <!-- 箭头 2→3 -->
  <line x1="405" y1="150" x2="432" y2="150" class="arrow" marker-end="url(#arr)"/>

  <!-- 卡片 3 -->
  <rect x="440" y="60" width="160" height="180" rx="12" fill="#fefefe" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.08))"/>
  <circle cx="520" cy="106" r="24" class="step-circle"/>
  <text class="step-num" x="520" y="106">3</text>
  <text font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="28" text-anchor="middle" x="520" y="158" fill="#4f9cf9">📋</text>
  <text class="step-title" x="520" y="195">一键使用</text>
  <text class="step-desc" x="520" y="218">点复制，粘贴进</text>
  <text class="step-desc" x="520" y="236">公众号后台</text>
</svg>
