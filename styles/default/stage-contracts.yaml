# ============================================================
# Pipeline 阶段合约 (Stage Contracts)
# 统一定义每个阶段的输入/输出格式，agent 间的数据交换规范
# ============================================================
#
# 目的：
#   1. 为 orchestrator 在 handoff 时提供格式校验依据
#   2. 为 agent 间的隐式合约提供显式 schema
#   3. 收敛 .inkflow.yaml 中分散的 validation 字段
#
# 字段说明：
#   output          — 阶段产物路径模板
#   required_headings — 产物 Markdown 中必须包含的 ## 标题
#   required_per_section — 大纲中每个 section 必须包含的子项
#   required_patterns — 产物中必须匹配的正则
#   forbidden_patterns — 产物中不得出现的模式
#   word_count      — 产物字数范围
#   severity_levels — 审校报告的严重性分级
#   issue_format    — 审校问题条目的表格格式
# ============================================================

contracts:

  # ── brief ──
  # 用户输入阶段，无 agent 产物，由 orchestrator 直接生成
  brief:
    output: "articles/{slug}/brief.md"
    # brief 格式由 orchestrator 和 brief-template.md 定义，此处不重复

  # ── research ──
  research:
    output: "articles/{slug}/research.md"
    required_headings:
      - "关键事实"
      - "代码片段"
      - "对比表格"
      - "不确定项"
    optional_headings:
      - name: "SEO 关键词"
        skip_if: "brief.skip_seo == true"
      - name: "竞品分析"
        skip_if: "brief.content_type == opinion || brief.content_column == story"
    word_count:
      min: 500
      max: 5000
    required_patterns:
      - "\\[来源\\]\\(http"
    forbidden_patterns:
      - "TODO"
      - "待补充"

  # ── outline ──
  outline:
    output: "articles/{slug}/outline.md"
    required_headings:
      - "总览"
    required_per_section:
      - "论点"
      - "关键细节"
      - "预估字数"
      - "视觉断点"
    word_count:
      min: 300
      max: 2000
    forbidden_patterns:
      - "TODO"

  # ── draft ──
  draft:
    output: "articles/{slug}/drafts/full.md"
    merged_from: "articles/{slug}/drafts/section-{N}.md"
    word_count:
      min: 800
      max: 5000
    forbidden_patterns:
      - "TODO"
    forbidden_patterns_from_rules:
      - .claude/rules/domains/wechat-article/quality-redline.md

  # ── figures ──
  figures:
    output: "articles/{slug}/figures/summary.md"
    individual_files: "articles/{slug}/figures/fig-{N}.{md|svg}"
    required_patterns:
      - "```mermaid|<svg"

  # ── audit ──
  audit:
    output: "articles/{slug}/output/audit.md"
    required_headings:
      - "审校报告"
      - "事实准确性"
      - "论证完整性"
      - "AI 味检测"
      - "风格偏离"
      - "句式问题"
      - "传播性评估"
      - "审校统计"
    severity_levels:
      - 高
      - 中
      - 低
    # auditor 输出的问题条目格式（polisher 按此格式解析）
    issue_format: |
      | 序号 | 位置 | 问题描述 | 严重性 | 修改建议 |
      |------|------|----------|--------|----------|

  # ── polish ──
  polish:
    output: "articles/{slug}/output/final.md"
    required_headings:
      - "润色结果"
      - "变更溯源表"
      - "润色变更摘要"
    forbidden_patterns:
      - "TODO"
      - "待确认"
    forbidden_patterns_from_rules:
      - .claude/rules/domains/wechat-article/quality-redline.md
    platform_checks:
      - type: css_safety
        source: tools/markdown-lint/lint-config.yaml
      - type: heading_level
        allowed: ["##", "###", "####"]
      - type: image_width
        max_width: 640

  # ── publish ──
  publish:
    output: "articles/{slug}/output/article.md"
    additional_outputs:
      - "articles/{slug}/output/plain.md"
      - "articles/{slug}/output/summary.md"
    required_patterns:
      - "^# "                        # H1 标题（typesetter 栏目标识区依赖）
    forbidden_patterns:
      - "<!-- FIGURE:"               # 未替换的图表占位符
      - "<!-- MEDIA:"                # 未替换的媒体占位符
      - '<img src="\.\./'            # 本地路径引用
      - '<svg[^>]* id='              # SVG 中残留 id 属性
