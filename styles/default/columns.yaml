# ============================================================
# 栏目统一配置 (Columns)
# 合并视觉主题 + 业务配置，添加新栏目只需在此文件增加一个块
# Source of truth for: visual-theming, article-structuring,
#   opening-crafting, writing-guiding, content-planning, etc.
# ============================================================

version: "3.0"

# ---- 排版基础参数 ----
typography:
  fontSize: 15
  lineHeight: 1.75
  letterSpacing: 1
  pageMargin: 12
  paragraphGap: 16
  sectionGap: 28
  imageGap: 20
  textAlign: justify
  fontStack: "-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
  titleFontSize:
    h1: 22
    h2: 18
    h3: 15

# ---- 栏目名映射 ----
# brief.content_column → 栏目 ID
column_map:
  personal: story

# ---- 栏目定义 ----
columns:
  academic:
    # 基本信息
    name: "学术前沿"
    nameEn: "Academic Frontier"
    icon: "📐"
    tagline: "深度 · 前瞻 · 严谨"
    personality: "学术期刊般的克制与精确，大量留白，强调数据与逻辑层级"

    # 视觉（原 theme-registry.yaml）
    lineHeightOverride: null
    colors:
      primary: "#1a5276"              # Deep Blue
      accent: "#c0782b"               # Orange-Brown
      text: "#3f3f3f"
      textSecondary: "#595959"
      textTertiary: "#888888"
      background: "#e4edf4"           # Light Blue
      backgroundDeep: "#c5d9e8"       # Medium Blue
      border: "#bfc5cb"
    dark:
      background: "#191919"
      surface: "#222222"
      text: "#c3c3c3"
      textSecondary: "#8a8a8a"
      border: "#3a3a3a"
      accent: "#c0782b"
      primary: "#4a9fd4"

    # 业务（原 column-defaults.yaml）
    skeleton: academic                    # article-structuring 骨架标识
    default_opening: blunt                # opening-crafting 默认策略
    default_cta: bookmark                 # writing-guiding CTA 推荐
    tone: objective_with_judgment         # writing-guiding 栏目语气
    suggested_components:                 # visual-theming 建议组件（按需选用，非强制）
      - data_chart
    frequency: "2-3/月"
    best_time: "周三/四 20:30-21:30"
    kpi_targets:
      completion_rate: 0.40
      bookmark_rate: 0.05
      share_rate: 0.03

  industry:
    name: "行业趋势"
    nameEn: "Industry Pulse"
    icon: "📡"
    tagline: "洞察 · 趋势 · 时效"
    personality: "简报式紧凑排布，信息密度高，卡片化，节奏明快"

    lineHeightOverride: null
    colors:
      primary: "#0e6655"              # Deep Green
      accent: "#b9770e"               # Deep Orange
      text: "#3f3f3f"
      textSecondary: "#595959"
      textTertiary: "#888888"
      background: "#dceee8"           # Light Teal
      backgroundDeep: "#b8ddd3"       # Medium Teal
      border: "#b5bfba"
    dark:
      background: "#191919"
      surface: "#222222"
      text: "#c3c3c3"
      textSecondary: "#8a8a8a"
      border: "#3a3a3a"
      accent: "#b9770e"
      primary: "#2ecc9a"

    skeleton: industry
    default_opening: contrast
    default_cta: share
    tone: opinionated
    suggested_components:
      - comparison_table
    frequency: "周报+突发"
    best_time: "周一 07:30-08:30"
    kpi_targets:
      open_rate: 0.15
      share_rate: 0.08

  tech:
    name: "技术专题"
    nameEn: "Tech Deep Dive"
    icon: "⚙️"
    tagline: "实践 · 原理 · 工具"
    personality: "工具化，装饰最少，功能性最强，代码友好，Markdown 兼容"

    lineHeightOverride: null
    colors:
      primary: "#4a235a"              # Deep Purple
      accent: "#1a5276"               # Blue
      text: "#3f3f3f"
      textSecondary: "#595959"
      textTertiary: "#888888"
      background: "#ece3f0"           # Light Purple
      backgroundDeep: "#d4c2dd"       # Medium Purple
      border: "#b5b5bf"
    dark:
      background: "#191919"
      surface: "#222222"
      text: "#c3c3c3"
      textSecondary: "#8a8a8a"
      border: "#3a3a3a"
      accent: "#5dade2"
      primary: "#bb8fce"

    skeleton: tech
    default_opening: pain_point
    default_cta: bookmark_try
    tone: practical_direct
    suggested_components:
      - flow_chart
    frequency: "2-4/月"
    best_time: "周二/四 21:00-22:00"
    kpi_targets:
      completion_rate: 0.35
      bookmark_rate: 0.08

  story:
    name: "人物故事"
    nameEn: "Profiles & Stories"
    icon: "✍️"
    tagline: "温度 · 叙事 · 人文"
    personality: "温暖有机，大图呼吸，引言突出，段落宽松"

    lineHeightOverride: 2.0           # story 行高加宽
    colors:
      primary: "#784212"              # Warm Brown
      accent: "#1a5276"               # Blue
      text: "#3f3f3f"
      textSecondary: "#6e5c50"        # Warm Gray
      textTertiary: "#888888"
      background: "#f0e0d0"           # Warm Beige
      backgroundDeep: "#e8cdb3"       # Tan
      border: "#c4b5a5"
    dark:
      background: "#191919"
      surface: "#222222"
      text: "#c3c3c3"
      textSecondary: "#8a8a8a"
      border: "#3a3a3a"
      accent: "#5dade2"
      primary: "#d4a06a"

    skeleton: story
    default_opening: story
    default_cta: comment
    tone: conversational
    suggested_components: []              # story 以叙事为主，视觉组件克制使用
    frequency: "1/月"
    best_time: "周六上午/周日晚"
    kpi_targets:
      share_rate: 0.10
      min_comments: 15

# ---- 代码语法高亮 ----
syntax_highlighting:
  keyword: "#c792ea"
  function: "#82aaff"
  class: "#ffcb6b"
  constant: "#f78c6c"
  comment: "#7c8ba1"
  string: "#c3e88d"
  background: "#1a1d23"
  text: "#e2e8f0"

# ---- 封面背景色 ----
cover_backgrounds:
  academic: "#1a5276"
  industry: "#0e6655"
  tech: "#4a235a"
  story: "#784212"

# ---- 总量控制 ----
content_mix:
  monthly_target: "7-10"
  max_per_day: 1

# ---- 栏目名别名映射 ----
column_aliases:
  personal: 人物故事

# ---- content_type → opening_style 回退映射 ----
content_type_fallback:
  opinion: blunt
  tutorial: pain_point
  deep_dive: contrast
  quick_take: question
